# A bare Command::new in the GUI-subsystem daemon spawns a console-subsystem
# child with a window that flashes and steals focus. Enforced by clippy, not a
# grep: only a Rust parser can exempt test code. Opt out with #[allow] instead.
disallowed-methods = [
  { path = "std::process::Command::new", reason = "use houston_core::spawn::command() so the child gets CREATE_NO_WINDOW on Windows (see core/houston-core/src/spawn.rs); tests may opt out with #![allow(clippy::disallowed_methods)]" },
  { path = "tokio::process::Command::new", reason = "use houston_core::spawn::tokio_command() so the child gets CREATE_NO_WINDOW on Windows (see core/houston-core/src/spawn.rs); tests may opt out with #![allow(clippy::disallowed_methods)]" },
  { path = "std::env::var", reason = "read the environment through houston_core::host_env::HostEnv so tests can inject one; migrate or allow with a `// env-ratchet` marker (scripts/check-env-ratchet.sh)" },
  { path = "std::env::var_os", reason = "read the environment through houston_core::host_env::HostEnv so tests can inject one; migrate or allow with a `// env-ratchet` marker (scripts/check-env-ratchet.sh)" },
  { path = "std::env::vars", reason = "read the environment through houston_core::host_env::HostEnv so tests can inject one; migrate or allow with a `// env-ratchet` marker (scripts/check-env-ratchet.sh)" },
  { path = "std::env::vars_os", reason = "read the environment through houston_core::host_env::HostEnv so tests can inject one; migrate or allow with a `// env-ratchet` marker (scripts/check-env-ratchet.sh)" },
  { path = "std::env::set_var", reason = "mutating the process environment races every other thread; inject a HostEnv instead (src/host_env.rs)" },
  { path = "std::env::remove_var", reason = "mutating the process environment races every other thread; inject a HostEnv instead (src/host_env.rs)" },
  { path = "dirs::home_dir", reason = "use HostEnv::home_dir (src/host_env.rs): it honours an injected HOME/USERPROFILE" },
]
