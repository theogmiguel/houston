# Runner configuration for the core workspace; invocation and rationale in
# docs/operations/development.md and docs/internals/testing.md.
nextest-version = "0.9.148"

[profile.default]
# Matches the `-j 3` budget that scripts/oom-shield.sh's caps were measured against.
test-threads = 3
# A hung PTY or daemon test fails after two minutes instead of blocking the run.
slow-timeout = { period = "30s", terminate-after = 4 }
# Reports a test that leaves a child process holding its output pipes.
leak-timeout = "500ms"
# A flake is a bug to reproduce with its discriminator, not to retry away.
retries = 0
fail-fast = false

[profile.ci]
junit = { path = "junit.xml" }

[test-groups]
# Tests that boot several real PTYs or daemons; capped below the global thread count.
pty-heavy = { max-threads = 2 }

[[profile.default.overrides]]
filter = 'test(/^orphan_survival_process::/) | test(/^windows_pty_lifecycle::/) | test(/^ssh_stalled_window::/)'
test-group = 'pty-heavy'

# Long by construction: seeded property loop in a debug build, a provider/seed matrix, and
# Slack socket-silence timers. The longest of them passed in 96 s of a 120 s default window.
[[profile.default.overrides]]
filter = 'test(scrollback::tests::random_pushes_match_the_contiguous_reference) | test(fast_provider_seed_matrix) | test(/^slack_intake_wire::/) | test(/^resume_wire::/)'
slow-timeout = { period = "60s", terminate-after = 5 }

# Ignored perf and latency tests run alone (`-j 1`, release) and sample for minutes. The bound
# only catches a hang (20 minutes); it is not a performance threshold and was not measured.
[[profile.default.overrides]]
filter = 'test(/^(perf_smoke|idle_loops_wire|supervisor_perf_smoke|voice_model_latency)::/)'
slow-timeout = { period = "60s", terminate-after = 20 }
