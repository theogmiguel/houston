[workspace]
resolver = "2"
members = ["houston-protocol", "houston-core"]

[workspace.package]
edition = "2021"
version = "0.17.1"
license = "Apache-2.0"
repository = "https://github.com/theogmiguel/houston"
homepage = "https://github.com/theogmiguel/houston"
authors = ["Théo Miguel"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

# line-tables-only keeps backtraces and test failure locations exact without full
# DWARF; deps get no debug info since we never step through them. For a full
# debugging session: `CARGO_PROFILE_DEV_DEBUG=2 cargo build`.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
# Thin LTO improves cross-crate optimization without full LTO's link cost.
lto = "thin"
# A single codegen unit enables whole-crate optimization.
codegen-units = 1
# Remove symbol tables from shipped binaries to reduce their size.
strip = "symbols"
