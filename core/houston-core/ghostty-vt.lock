# The pin for the terminal emulator the daemon owns (D9).
#
# One file rather than constants in build.rs because three consumers must
# agree and only one of them is Rust: `build.rs` builds the native library,
# `scripts/build-ghostty-vt-wasm.sh` builds the artifact the RENDERER runs,
# and `scripts/check-ghostty-vt-pin.sh` refuses a daemon binary or a vendored
# WASM that came from anything else. Flat `key = "value"` lines, no tables and
# no quoting rules beyond that, so shell, Rust and Node each parse it in three
# lines instead of taking a TOML dependency.
#
# Bumping the revision means: bump it here, rebuild the WASM with
# scripts/build-ghostty-vt-wasm.sh, re-run the patch (git apply will refuse if
# upstream moved the two hunks it touches), and re-run the P9 parity suite.

revision = "9f62873bf195e4d8a762d768a1405a5f2f7b1697"
source_url = "https://codeload.github.com/ghostty-org/ghostty/tar.gz/9f62873bf195e4d8a762d768a1405a5f2f7b1697"
source_sha256 = "16c78c876b07cdf7c88e6dcd622ce88b9723329b07e82a04a7b8c00d1586d226"

# The version string stamped into both artifacts, and what
# check-ghostty-vt-pin.sh greps for. Matches the shape the vendored WASM
# already carried, so a rebuilt artifact stays comparable to the old one.
lib_version_string = "0.1.0-dev+9f62873bf195e4d8a762d768a1405a5f2f7b1697"

# The toolchain. `build.zig.zon` at the revision above declares
# minimum_zig_version = 0.15.2; the library does not build with a newer Zig
# without source changes, so this is a pin, not a floor.
zig_version = "0.15.2"
zig_url_prefix = "https://ziglang.org/download/0.15.2/zig-"
zig_sha256_x86_64-linux = "02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239"
zig_sha256_aarch64-linux = "958ed7d1e00d0ea76590d27666efbf7a932281b3d7ba0c6b01b0ff26498f667f"
zig_sha256_x86_64-macos = "375b6909fc1495d16fc2c7db9538f707456bfc3373b14ee83fdd3e22b3d43f7f"
zig_sha256_aarch64-macos = "3cc2bab367e185cdfb27501c4b30b1b0653c28d9f73df8dc91488e66ece5fa6b"
zig_sha256_x86_64-windows = "3a0ed1e8799a2f8ce2a6e6290a9ff22e6906f8227865911fb7ddedc3cc14cb0c"

# Bumped by houston_snapshot.zig, mirrored here so the check script can assert
# the daemon and the vendored WASM agree without running either.
snapshot_format_version = "1"
