<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-zr4CVeqhxuOZmulFRBMmsw3LOO4CjZ2AnEeiDx5SFAU='; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; media-src 'self' blob:; connect-src 'self' ws://127.0.0.1:* ipc: http://ipc.localhost"
    />
    <title>Houston</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        overscroll-behavior: none;
        background: #0a0a0b;
        color: #f4f4f6;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      #root {
        min-height: 100%;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      .boot-spinner {
        width: 32px;
        height: 32px;
        border: 2px solid currentColor;
        border-top-color: transparent;
        border-radius: 50%;
        animation: boot-spin 1s linear infinite;
        opacity: 0.8;
      }
    </style>
    <script>
      (function () {
        try {
          var chromeId = localStorage.getItem('tr-chrome-theme') || ''
          var isPaper = chromeId === 'paper'
          if (chromeId === '') {
            var legacyId = localStorage.getItem('tr-theme') || ''
            var LEGACY_LIGHT_IDS = [
              'light',
              'warp-light',
              'solarized-light',
              'gruvbox-light',
              'marble',
              'pink-city',
              'snowy'
            ]
            isPaper = LEGACY_LIGHT_IDS.indexOf(legacyId) !== -1
          }
          if (isPaper) {
            document.documentElement.style.colorScheme = 'light'
            document.documentElement.style.background = '#e8e8ea'
            var s = document.createElement('style')
            s.textContent = 'html,body{background:#e8e8ea;color:#131316}'
            document.head.appendChild(s)
          }
        } catch (_) {
        }
      })()
    </script>
  </head>
  <body>
    <div id="root">
      <div style="display: flex; flex-direction: column; height: 100vh; width: 100vw">
        <div style="height: 28px; width: 100%; flex-shrink: 0"></div>
        <div style="display: flex; flex: 1; align-items: center; justify-content: center">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 16px; color: #7c86f5">
            <div class="boot-spinner"></div>
            <p style="font-size: 14px; margin: 0; color: inherit; opacity: 0.6">Loading…</p>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
