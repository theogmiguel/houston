<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Workspace states</title>
<style>
[data-theme=graphite]{--page:#0b0b0c;--rail:#1c1c1f;--content:#161618;--border:rgba(255,255,255,.09);--line-strong:rgba(255,255,255,.16);--field:rgba(255,255,255,.06);--hover:rgba(255,255,255,.05);--sel:rgba(255,255,255,.09);--accent:#2f6fe8;--accent-ink:#64a0ff;--t1:rgba(255,255,255,.92);--t2:rgba(255,255,255,.66);--t3:rgba(255,255,255,.52);--warn:#f5a524;--ok-ink:#30d158;--stop-ink:#ff6b61;--add-bg:rgba(48,209,88,.10);--del-bg:rgba(255,107,97,.10);--pane:#0f0f11;--pane-head:#18181b;--claude:#d97757;--codex:rgba(255,255,255,.92);--composer:#18181b}
[data-theme=paper]{--page:#e4e4e8;--rail:#ececef;--content:#f5f5f7;--border:rgba(0,0,0,.09);--line-strong:rgba(0,0,0,.16);--field:rgba(0,0,0,.05);--hover:rgba(0,0,0,.045);--sel:rgba(0,0,0,.09);--accent:#0a63e0;--accent-ink:#0a5cd1;--t1:#1d1d1f;--t2:#424245;--t3:#5b5b60;--warn:#b45309;--ok-ink:#1d7a3a;--stop-ink:#c0362c;--add-bg:rgba(29,122,58,.09);--del-bg:rgba(192,54,44,.08);--pane:#fff;--pane-head:#f7f7f9;--claude:#c25f3f;--codex:#1d1d1f;--composer:#fff}
*{box-sizing:border-box}
body{margin:0}
.scroll{color:var(--t1);font:13px/18px Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.mono{font-family:'JetBrains Mono',ui-monospace,Consolas,monospace;font-size:11px}
.top{display:flex;align-items:center;gap:12px;margin:0 0 16px}
.top h1{font-size:13px;font-weight:600;margin:0}
.top button{margin-left:auto;height:28px;padding:0 12px;border-radius:6px;border:1px solid var(--border);background:var(--secondary);color:var(--foreground);font:inherit;font-size:13px;font-weight:500;cursor:pointer}
.variant{margin:0 0 24px}
.variant h2{font-size:13px;font-weight:600;margin:0 0 2px}
.variant p{margin:0 0 10px;color:var(--muted-foreground);font-size:12px;line-height:16px}
.scroll{overflow:hidden;border-radius:10px;border:1px solid var(--line-strong)}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);height:540px;width:1000px;background:var(--content)}
.ico{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ico-s{width:13px;height:13px}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
/* rail */
.rail{background:var(--rail);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:8px;gap:1px;min-width:0;overflow:hidden}
.brand{display:flex;align-items:center;gap:8px;height:36px;padding:0 6px;font-weight:600}
.search{display:flex;align-items:center;gap:8px;height:28px;padding:0 8px;border-radius:6px;background:var(--field);color:var(--t3);margin:2px 0 6px}
.sect{display:flex;align-items:center;height:28px;padding:10px 8px 0;color:var(--t3);font-size:11px;line-height:14px;font-weight:600}
.sect .add{margin-left:auto;color:var(--t3)}
.row{display:flex;align-items:center;gap:8px;height:28px;padding:0 8px;border-radius:6px;color:var(--t2);white-space:nowrap;min-width:0}
.row.on{background:var(--sel);color:var(--t1)}
.row .ct{margin-left:auto;color:var(--t3);font-size:12px;font-variant-numeric:tabular-nums}
.row.proj{color:var(--t1);font-weight:600}
.th{display:block;margin-left:14px;padding:5px 8px;border-radius:6px;border-left:1px solid var(--border);border-top-left-radius:0;border-bottom-left-radius:0}
.th.on{background:var(--sel);border-left-color:transparent;border-radius:6px}
.th .l1{display:flex;gap:8px;align-items:baseline}
.th .ti{font-weight:500;color:var(--t1);flex:1}
.th .tm{color:var(--t3);font-size:11px;font-variant-numeric:tabular-nums}
.th .tm.run{color:var(--accent-ink)}
.th .l2{display:flex;gap:8px;align-items:center;color:var(--t3);margin-top:1px}
.th .l2 .pr{margin-left:auto;display:inline-flex;align-items:center;gap:3px;font-size:11px;font-variant-numeric:tabular-nums}
.th .l2 .pr.ok{color:var(--ok-ink)}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.dot.claude{background:var(--claude)}.dot.codex{background:var(--codex)}
.foot{margin-top:auto;border-top:1px solid var(--border);padding-top:6px}
/* main */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.titlebar{height:40px;flex:none;display:flex;align-items:center;gap:6px;padding:0 12px;color:var(--t3)}
.titlebar b{color:var(--t1);font-weight:600}
.wpill{height:26px;padding:0 10px;border-radius:6px;display:inline-flex;align-items:center;gap:6px;color:var(--t2);font-weight:500;white-space:nowrap}
.wpill.on{background:var(--sel);color:var(--t1)}
.wpill .n{color:var(--t3);font-size:11px;font-variant-numeric:tabular-nums}
.area{flex:1;min-height:0;display:grid;grid-template-columns:1.1fr 1fr;gap:8px;padding:0 8px 8px}
.col{display:grid;gap:8px;min-height:0;min-width:0}
.col.split{grid-template-rows:1.5fr 1fr}
.pane{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--pane);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.pane.focus{border-color:var(--line-strong)}
.tabs{height:30px;flex:none;display:flex;align-items:stretch;background:var(--pane-head);border-bottom:1px solid var(--border);min-width:0}
.tab{display:flex;align-items:center;gap:6px;padding:0 10px;color:var(--t3);border-right:1px solid var(--border);min-width:0;max-width:190px;font-size:12px;white-space:nowrap}
.tab.on{background:var(--pane);color:var(--t1);font-weight:500;box-shadow:0 1px 0 var(--pane)}
.tab.fix{flex:none}
.tab .x{color:var(--t3);margin-left:2px}
.tabs .plus{display:grid;place-items:center;width:30px;color:var(--t3)}
.body{flex:1;min-height:0;padding:12px;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.bubble{align-self:flex-end;max-width:80%;background:var(--field);border-radius:12px;padding:7px 11px}
.txt{color:var(--t2);max-width:92%}
.composer{margin-top:auto;border:1px solid var(--line-strong);border-radius:12px;background:var(--composer);padding:9px 12px;color:var(--t3)}
.dl{display:grid;grid-template-columns:26px 12px minmax(0,1fr);font-family:'JetBrains Mono',ui-monospace,Consolas,monospace;font-size:11px;line-height:18px;white-space:pre;overflow:hidden}
.dl span:first-child{color:var(--t3);text-align:right;padding-right:6px}
.dl.a{background:var(--add-bg)}.dl.a span:nth-child(2){color:var(--ok-ink)}
.dl.d{background:var(--del-bg)}.dl.d span:nth-child(2){color:var(--stop-ink)}
.fh{color:var(--t2);font-size:12px;font-weight:500}
.term{font-family:'JetBrains Mono',ui-monospace,Consolas,monospace;font-size:11px;line-height:17px;color:var(--t2);white-space:pre;overflow:hidden}
.term .ok{color:var(--ok-ink)}
.area2{flex:1;min-height:0;display:grid;grid-template-columns:1.1fr 1fr;gap:8px;padding:0 8px 8px 8px}
.c2{display:flex;flex-direction:column;min-width:0;min-height:0}
.strip{height:40px;flex:none;display:flex;align-items:flex-end;min-width:0}
.tt{position:relative;height:32px;display:flex;align-items:center;gap:6px;padding:0 12px;border-radius:10px 10px 0 0;color:var(--t3);font-size:12px;white-space:nowrap;min-width:0;max-width:200px}
.tt.on{background:var(--pane);color:var(--t1);font-weight:500}
.tt.on::before,.tt.on::after{content:"";position:absolute;bottom:0;width:10px;height:10px}
.tt.on::after{right:-10px;background:radial-gradient(circle at 100% 0,transparent 9.500px,var(--pane) 10px)}
.tt.on::before{left:-10px;background:radial-gradient(circle at 0 0,transparent 9.500px,var(--pane) 10px)}
.strip .tt.on:first-child::before{display:none}
.tt.fix{flex:none}
.tt .x{color:var(--t3)}
.tplus{height:32px;width:30px;display:grid;place-items:center;color:var(--t3);flex:none}
.wc{margin-left:auto;height:40px;display:flex;align-items:center;gap:16px;padding:0 6px 0 12px;color:var(--t3);flex:none}
.p2{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--pane);border-radius:10px;overflow:hidden}
.p2.first{border-top-left-radius:0}
.p2.low{margin-top:8px}
.p2.low .tabs{background:transparent}
.pj{width:14px;height:14px;border-radius:4px;background:var(--sel);color:var(--t2);font-size:9px;font-weight:700;display:inline-grid;place-items:center;flex:none}
.th .l2{font-size:11px;margin:0 0 1px}
.th .l1{align-items:center}
.th .l1 .pr{display:inline-flex;align-items:center;gap:3px;font-size:11px;color:var(--t3);font-variant-numeric:tabular-nums}
.th .l1 .pr.ok{color:var(--ok-ink)}
.th.flat{margin-left:0;border-left:0;border-radius:6px}
.brand .new{margin-left:auto;color:var(--t3);display:grid}
.row.wsel{background:var(--field);color:var(--t1);font-weight:500;margin-bottom:6px}
.foot .row{height:24px;font-size:12px}
.picker{width:320px;max-width:100%;margin:36px auto 0;display:flex;flex-direction:column;gap:2px}
.pk{display:flex;align-items:center;gap:8px;height:30px;padding:0 8px;border-radius:6px;color:var(--t2);min-width:0}
.pk.on{background:var(--sel);color:var(--t1)}
.pk .pn{font-weight:500;flex:none}
.pk .pp{margin-left:auto;color:var(--t3)}
.app{height:330px}
.app.tall{height:385px}
.app.narrow{grid-template-columns:minmax(0,1fr);width:520px;height:290px}
.picker.wide{width:440px}
.pk .pp{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.variant h2{margin-bottom:8px}.variant p{margin-top:-6px}
.hint{padding:4px 8px 4px 30px;color:var(--t3);font-size:12px}
.errm{width:12px;height:12px;border-radius:50%;background:var(--stop-ink);color:var(--rail);font:800 9px/12px Inter,sans-serif;text-align:center;flex:none}
.over{display:flex;align-items:flex-end;min-width:0;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}
.over .tt{flex:none;max-width:170px}
.sk{height:12px;border-radius:4px;background:var(--field)}
.errbox{margin:auto;max-width:300px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;color:var(--t2)}
.errbox b{color:var(--t1);font-weight:600}
.errbox .retry{height:28px;padding:0 12px;border-radius:6px;border:1px solid var(--line-strong);background:var(--field);color:var(--t1);font-weight:500;display:inline-flex;align-items:center;margin-top:4px}
</style>
</head>
<body>

<div id="root"></div>
<script>
const P = {
  search:'<circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/>',
  folder:'<path d="M1.5 4.5a1 1 0 0 1 1-1h3l1.5 1.5h6.5a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1z"/>',
  layout:'<rect x="1.5" y="2.5" width="13" height="11" rx="2"/><path d="M8.5 2.5v11M8.5 8h6"/>',
  branch:'<circle cx="4" cy="3.5" r="1.5"/><circle cx="4" cy="12.5" r="1.5"/><circle cx="12" cy="5.5" r="1.5"/><path d="M4 5v6M12 7c0 3-8 1.500-8 4"/>',
  pr:'<circle cx="4" cy="3.500" r="1.500"/><circle cx="4" cy="12.500" r="1.500"/><circle cx="12" cy="12.500" r="1.500"/><path d="M4 5v6M12 11V7a2 2 0 0 0-2-2H8"/>',
  chat:'<path d="M2 3.500h12v8H7l-3 2.500v-2.500H2z"/>',
  diff:'<path d="M5 2.500v6M2 5.500h6M9 12.500h5"/>',
  globe:'<circle cx="8" cy="8" r="6"/><path d="M2 8h12M8 2c2 2 2 10 0 12M8 2c-2 2-2 10 0 12"/>',
  term:'<rect x="1.500" y="2.500" width="13" height="11" rx="2"/><path d="m4.500 6 2 2-2 2M8.500 10.500h3"/>',
  plus:'<path d="M8 3.500v9M3.500 8h9"/>',
  x:'<path d="m4.500 4.500 7 7M11.500 4.500l-7 7"/>',
  chev:'<path d="m4 6 4 4 4-4"/>',
  edit:'<path d="M9.500 3.500 12.500 6.500 6 13H3v-3z"/><path d="M8 13h5"/>',
  box:'<rect x="2" y="3" width="12" height="3"/><path d="M3 6v7h10V6M6.500 9h3"/>'
};
const ico = (n, s) => `<svg class="ico${s ? ' ico-s' : ''}" viewBox="0 0 16 16">${P[n]}</svg>`;

const T = {
  redesign:{ti:'Find the redesign PR',tm:'20m',br:'v2-redesign',pr:'369',prov:'claude',proj:'Houston'},
  release:{ti:'Release channel mapping',tm:'1d',br:'v2-grid-toolkit',pr:'',prov:'codex',proj:'Houston'},
  dispatch:{ti:'Dispatch: route map',tm:'Running 50s',run:1,br:'docs/labels',pr:'620',ok:1,prov:'claude',proj:'dispatch'},
  nexus:{ti:'Teams API permissions',tm:'2h',br:'feat/teams-api',pr:'',prov:'claude',proj:'nexus'}
};
const pj = (name) => `<span class="pj">${name[0].toUpperCase()}</span>`;
const thread = (k, on, flat) => {
  const t = T[k];
  return `<div class="th${on ? ' on' : ''}${flat ? ' flat' : ''}"><div class="l2">${pj(t.proj)}<span style="flex:none">${t.proj}</span><span class="mono trunc">${t.br}</span><span class="tm${t.run ? ' run' : ''}" style="margin-left:auto;flex:none">${t.tm}</span></div>
  <div class="l1"><span class="ti trunc">${t.ti}</span>${t.pr ? `<span class="pr${t.ok ? ' ok' : ''}">${ico('pr',1)}${t.pr}</span>` : ''}<span class="dot ${t.prov}"></span></div></div>`;
};
const head = `<div class="brand">Houston<span class="new">${ico('edit')}</span></div><div class="search">${ico('search')}<span>Search</span></div>`;
const foot = `<div class="foot"><div class="row"><span>Working</span><span class="ct">1</span></div><div class="row"><span>Needs you</span><span class="ct">1</span></div><div class="row"><span>Closed</span><span class="ct">35</span></div></div>`;
const rail = {
  A: head + `<div class="sect">Workspaces<span class="add">${ico('plus',1)}</span></div>
     <div class="row proj">${ico('chev',1)}<span>Today</span></div>${thread('redesign',1)}${thread('dispatch')}${thread('nexus')}
     <div class="row proj">${ico('chev',1)}<span>Houston Dev</span></div>${thread('release')}
     <div class="row">${ico('layout')}<span>Reviews</span><span class="ct">4</span></div>` + foot,
  B: head + `<div class="row wsel">${ico('layout')}<span>Today</span><span class="ct">${ico('chev',1)}</span></div>
     ${thread('redesign',1,1)}${thread('dispatch',0,1)}${thread('nexus',0,1)}` + foot
};
const ttab = (i, label, on, dot) => `<div class="tt${on ? ' on' : ''}${dot ? '' : ' fix'}">${dot ? `<span class="dot ${dot}"></span>` : ico(i,1)}<span class="${dot ? 'trunc' : ''}">${label}</span>${on ? `<span class="x">${ico('x',1)}</span>` : ''}</div>`;
const tab = (i, label, on) => `<div class="tab fix${on ? ' on' : ''}">${ico(i,1)}<span>${label}</span>${on ? `<span class="x">${ico('x',1)}</span>` : ''}</div>`;
const plus = `<div class="plus">${ico('plus',1)}</div>`;
const tplus = `<div class="tplus">${ico('plus',1)}</div>`;
const wc = `<div class="wc"><svg class="ico ico-s" viewBox="0 0 16 16"><path d="M3.500 8h9"/></svg><svg class="ico ico-s" viewBox="0 0 16 16"><rect x="3.500" y="3.500" width="9" height="9" rx="1"/></svg>${ico('x',1)}</div>`;
const chat = `<div class="c2"><div class="strip">${ttab('chat','Find the redesign PR',1,'claude')}${ttab('chat','Dispatch: route map',0,'claude')}${tplus}</div>
    <div class="p2 first"><div class="body"><div class="bubble">Bring their panes and tabs, keep our frontend.</div>
    <div class="txt">The workspace record stays on the server. Each grid becomes a workspace with the same name, and a tab is a chat or one surface of a thread.</div>
    <div class="composer">Ask anything</div></div></div></div>`;
const surfaces = `<div class="c2"><div class="strip">${ttab('diff','Changes',0)}${ttab('pr','#369',1)}${tplus}${wc}</div>
    <div class="p2" style="flex:1.500"><div class="body" style="gap:6px"><div class="fh">The workspace record replaces the grid record <span style="color:var(--ok-ink)">Open</span></div>
      <div class="txt">v2-redesign into v2 · 5 commits · checks passing</div></div></div>
    <div class="p2 low"><div class="tabs">${tab('term','Terminal',1)}${plus}</div>
      <div class="body"><div class="term">$ vp test run houston/workspaces
<span class="ok"> ✓</span> migrates a row grid to columns
 Tests  14 passed</div></div></div></div>`;
const pick = (n, path, on) => `<div class="pk${on ? ' on' : ''}">${pj(n)}<span class="pn">${n}</span><span class="mono trunc pp">${path}</span></div>`;
const launcher = `<div class="c2"><div class="strip">${ttab('edit','New thread',1)}${tplus}${wc}</div>
    <div class="p2 first"><div class="body"><div class="picker"><div class="sect" style="padding:0 8px">Recent</div>
      ${pick('Houston','~/ProjetosPessoais/Houston',1)}${pick('dispatch','~/cdv/dispatch')}${pick('nexus','~/cdv/nexus')}
      <div class="pk">${ico('folder')}<span class="pn">All projects</span><span class="pp" style="margin-left:auto">5</span></div></div>
    <div class="composer">Ask anything</div></div></div></div>`;
Object.assign(T, {
  long:{ti:'Investigate why the nightly release channel mapping drifts after a restart',tm:'3d',br:'houston/investigate-release-channel-mapping-drift',pr:'1204',prov:'codex',proj:'project_eagle_backoffice'},
  failed:{ti:'Teams API permissions',tm:'2h',br:'feat/teams-api',pr:'',prov:'claude',proj:'nexus',err:1}
});
const threadX = (k, on) => thread(k, on).replace('<span class="dot', T[k].err ? '<span class="errm">!</span><span class="dot' : '<span class="dot');
const wsHead = (name, open) => `<div class="row proj">${ico(open ? 'chev' : 'layout', open)}<span class="trunc">${name}</span></div>`;
const sect = `<div class="sect">Workspaces<span class="add">${ico('plus',1)}</span></div>`;
const railMain = head + sect + wsHead('Today',1) + thread('redesign',1) + thread('dispatch') + thread('nexus') + wsHead('Houston Dev',1) + thread('release') + `<div class="row">${ico('layout')}<span>Reviews</span><span class="ct">4</span></div>` + foot;
const railEmpty = head + sect + wsHead('Workspace 1',1) + `<div class="hint">No threads yet</div>` + foot.replace('>1<','>0<').replace('>1<','>0<').replace('>35<','>0<');
const railLong = head + sect + wsHead('Quarterly reconciliation and backoffice cleanup for the investment desk',1) + thread('long',1) + thread('dispatch') + foot;
const railState = head + sect + wsHead('Today',1) + thread('redesign',1) + threadX('failed') + foot;
const launcherFirst = launcher.replace('p2 first','p2 first').replace('${wc}','');
const emptyArea = `<div class="c2" style="grid-column:1/-1"><div class="strip">${ttab('edit','New thread',1)}${tplus}${wc}</div>
  <div class="p2 first"><div class="body"><div class="picker wide"><div class="sect" style="padding:0 8px">Start in a project</div>
  <div class="pk on">${ico('folder')}<span class="pn">Add project</span><span class="pp">Open a folder or clone a repository</span></div>
  <div class="pk">${ico('chat')}<span class="pn">No project</span><span class="pp">Its own folder, no git</span></div></div>
  <div class="composer" style="width:520px;max-width:100%;margin:auto auto 0">Ask anything</div></div></div></div>`;
const manyTabs = ['Investigate why the nightly release channel mapping drifts','Dispatch: route map','Teams API permissions','Release channel mapping','Find the redesign PR','Sidebar papercuts'];
const longArea = `<div class="c2"><div class="strip"><div class="over">${manyTabs.map((t, n) => ttab('chat', t, n === 0, n % 2 ? 'codex' : 'claude')).join('')}</div>${tplus}</div>
  <div class="p2 first"><div class="body"><div class="bubble">Why does the mapping drift after a restart?</div><div class="txt">The channel directory is resolved before the runtime file is written, so the first read after a restart sees the previous value.</div><div class="composer">Ask anything</div></div></div></div>
  <div class="c2"><div class="strip"><div class="over" style="-webkit-mask-image:none;mask-image:none"><div class="tt on" style="max-width:200px">${ico('diff',1)}<span class="trunc">releaseChannelMapping.ts</span><span class="x">${ico('x',1)}</span></div></div>${tplus}${wc}</div>
  <div class="p2"><div class="body" style="gap:6px"><div class="fh mono trunc">apps/server/src/houston/releaseChannelMapping.ts</div><div><div class="dl d"><span>41</span><span>-</span><span>  const dir = resolveChannelDir(env)</span></div><div class="dl a"><span>41</span><span>+</span><span>  const dir = yield* runtime.channelDir</span></div></div></div></div></div>`;
const stateArea = `<div class="c2"><div class="strip">${ttab('chat','Find the redesign PR',1,'claude')}${tplus}</div>

  <div class="p2"><div class="body"><div class="errbox"><b>This thread could not be loaded</b><span>The server did not answer for thread 4f1c within 10s. The thread and its run are unchanged.</span><span class="retry">Retry</span></div></div></div></div>`;

const app = (r, a, cls) => `<div class="app ${cls || ''}">${r ? `<aside class="rail">${r}</aside>` : ''}<div class="main"><div class="area2">${a}</div></div></div>`;
const V = [
  ['Main, dark', 'Three projects in one workspace; chat and surface tabs in the window bar.', app(railMain, chat + surfaces, 'tall'), 'graphite', 1000],

];
