<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Houston command palette</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.pal-g{color-scheme:dark;--raised:#26262a;--border:rgba(255,255,255,.09);--field:rgba(255,255,255,.06);--sel:rgba(255,255,255,.09);--accent-ink:#64a0ff;--t1:rgba(255,255,255,.92);--t2:rgba(255,255,255,.66);--t3:rgba(255,255,255,.52);--warn:#f5a524;--warn-wash:rgba(245,165,36,.08);--warn-line:rgba(245,165,36,.32);--shadow-2:0 12px 32px -8px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.08);--scrim:rgba(0,0,0,.28);--rail:#1c1c1f;--content:#161618;--card:#202023;--pane:#0f0f11;--pane-head:#18181b;--term:#0f0f11;--border-hover:rgba(255,255,255,.16);--line-strong:rgba(255,255,255,.16);--hover:rgba(255,255,255,.05);--accent:#2f6fe8;--accent-hover:#4f85ec;--accent-muted:rgba(47,111,232,.15);--ok:#30d158;--ok-ink:#30d158;--stop:#ff6b61;--stop-ink:#ff6b61;--add-bg:rgba(48,209,88,.10);--del-bg:rgba(255,107,97,.10);--code-bg:#18181b;--shadow-1:0 12px 32px -8px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.08);--danger-fill:#d93a30;--danger-wash:rgba(255,107,97,.10);--tog-off:rgba(255,255,255,.18);--claude:#d97757;--codex:rgba(255,255,255,.92);--composer:#18181b}
.pal-p{color-scheme:light;--raised:#ffffff;--border:rgba(0,0,0,.09);--field:rgba(0,0,0,.05);--sel:rgba(0,0,0,.09);--accent-ink:#0a5cd1;--t1:#1d1d1f;--t2:#424245;--t3:#5b5b60;--warn:#b45309;--warn-wash:rgba(180,83,9,.06);--warn-line:rgba(180,83,9,.3);--shadow-2:0 12px 32px -10px rgba(0,0,0,.18),0 0 0 1px rgba(0,0,0,.08);--scrim:rgba(0,0,0,.12);--rail:#ececef;--content:#f5f5f7;--card:#ffffff;--pane:#ffffff;--pane-head:#f7f7f9;--term:#ffffff;--border-hover:rgba(0,0,0,.16);--line-strong:rgba(0,0,0,.16);--hover:rgba(0,0,0,.045);--accent:#0a63e0;--accent-hover:#0954be;--accent-muted:rgba(10,99,224,.12);--ok:#1d7a3a;--ok-ink:#1d7a3a;--stop:#c0362c;--stop-ink:#c0362c;--add-bg:rgba(29,122,58,.09);--del-bg:rgba(192,54,44,.08);--code-bg:#f7f7f9;--shadow-1:0 12px 32px -10px rgba(0,0,0,.18),0 0 0 1px rgba(0,0,0,.08);--danger-fill:#c0362c;--danger-wash:rgba(192,54,44,.08);--tog-off:rgba(0,0,0,.22);--claude:#c25f3f;--codex:#1d1d1f;--composer:#ffffff}
.pal{font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;font-optical-sizing:auto;font-size:13px;line-height:18px;color:var(--t1);-webkit-font-smoothing:antialiased}
.pal *{box-sizing:border-box}
.pal .mono{font-family:'JetBrains Mono',ui-monospace,Consolas,monospace;font-size:12px}
.pal .lbl{font-size:11px;line-height:14px;font-weight:600;letter-spacing:.01em;color:var(--t3)}
.pal .c2{color:var(--t2)}.pal .c3{color:var(--t3)}
.pal .ico{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.pal .ico-s{width:14px;height:14px}
.pal .kbd{min-width:18px;height:18px;padding:0 4px;border-radius:4px;border:1px solid var(--border);font-size:11px;line-height:1;color:var(--t3);display:inline-flex;align-items:center;justify-content:center;background:var(--field)}
.pal .opt{height:32px;display:flex;align-items:center;gap:10px;padding:0 10px;border-radius:6px;color:var(--t1)}
.pal .opt.on{background:var(--sel)}
.pal .trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.pal mark{background:transparent;color:var(--t1);font-weight:650}
.pal .opt{color:var(--t2)}.pal .opt.on{color:var(--t1)}
.pal .sg{width:14px;height:14px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.pal .sg-work svg{animation:spin 1.1s linear infinite}
.pal .sg-needs i{width:8px;height:8px;border-radius:50%;background:var(--warn);box-shadow:0 0 0 2px var(--warn-wash),0 0 0 3px var(--warn-line)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.pal .sg-work svg{animation:none}}
/* state-icons */
:root,[data-theme]{--warn-ink:#f5a524}[data-theme=paper]{--warn-ink:#9a4a06}
.st.work::before,.st.done::before,.st.needs::before,.st.err::before,.sg-fin i,.sg-needs i,.sg-err i{content:"";display:block;width:14px;height:14px;border:0;border-radius:0;box-shadow:none;transform:none;animation:none;font-size:0;background:currentColor;-webkit-mask:var(--m) center/14px no-repeat;mask:var(--m) center/14px no-repeat}
.st.work::before{--m:url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2024%2024'%20fill%3D'none'%20stroke%3D'black'%20stroke-width%3D'2'%20stroke-linecap%3D'round'%20stroke-linejoin%3D'round'%3E%3Ccircle%20cx%3D'12'%20cy%3D'12'%20r%3D'8'%20stroke-dasharray%3D'3%203.3'%2F%3E%3C%2Fsvg%3E");color:var(--accent-ink)}
.st.done::before{--m:url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2024%2024'%20fill%3D'none'%20stroke%3D'black'%20stroke-width%3D'2'%20stroke-linecap%3D'round'%20stroke-linejoin%3D'round'%3E%3Ccircle%20cx%3D'12'%20cy%3D'12'%20r%3D'8.5'%2F%3E%3Cpath%20d%3D'm8.5%2012.2%202.4%202.4%204.6-4.8'%2F%3E%3C%2Fsvg%3E");color:var(--ok-ink,var(--ok))}
.st.needs::before{--m:url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2024%2024'%20fill%3D'none'%20stroke%3D'black'%20stroke-width%3D'2'%20stroke-linecap%3D'round'%20stroke-linejoin%3D'round'%3E%3Ccircle%20cx%3D'12'%20cy%3D'12'%20r%3D'8.5'%2F%3E%3Cpath%20d%3D'M9.8%209.6a2.3%202.3%200%200%201%204.4.9c0%201.6-2.2%201.9-2.2%203.2'%2F%3E%3Cpath%20d%3D'M12%2016.6v.1'%2F%3E%3C%2Fsvg%3E");color:var(--warn)}
.st.err::before{--m:url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2024%2024'%20fill%3D'none'%20stroke%3D'black'%20stroke-width%3D'2'%20stroke-linecap%3D'round'%20stroke-linejoin%3D'round'%3E%3Ccircle%20cx%3D'12'%20cy%3D'12'%20r%3D'8.5'%2F%3E%3Cpath%20d%3D'M12%207.8v5'%2F%3E%3Cpath%20d%3D'M12%2016.2v.1'%2F%3E%3C%2Fsvg%3E");color:var(--stop-ink,var(--stop))}
.sg-fin i{--m:url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2024%2024'%20fill%3D'none'%20stroke%3D'black'%20stroke-width%3D'2'%20stroke-linecap%3D'round'%20stroke-linejoin%3D'round'%3E%3Ccircle%20cx%3D'12'%20cy%3D'12'%20r%3D'8.5'%2F%3E%3Cpath%20d%3D'm8.5%2012.2%202.4%202.4%204.6-4.8'%2F%3E%3C%2Fsvg%3E");color:var(--ok-ink,var(--ok))}.sg-needs i{--m:url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2024%2024'%20fill%3D'none'%20stroke%3D'black'%20stroke-width%3D'2'%20stroke-linecap%3D'round'%20stroke-linejoin%3D'round'%3E%3Ccircle%20cx%3D'12'%20cy%3D'12'%20r%3D'8.5'%2F%3E%3Cpath%20d%3D'M9.8%209.6a2.3%202.3%200%200%201%204.4.9c0%201.6-2.2%201.9-2.2%203.2'%2F%3E%3Cpath%20d%3D'M12%2016.6v.1'%2F%3E%3C%2Fsvg%3E");color:var(--warn)}.sg-err i{--m:url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2024%2024'%20fill%3D'none'%20stroke%3D'black'%20stroke-width%3D'2'%20stroke-linecap%3D'round'%20stroke-linejoin%3D'round'%3E%3Ccircle%20cx%3D'12'%20cy%3D'12'%20r%3D'8.5'%2F%3E%3Cpath%20d%3D'M12%207.8v5'%2F%3E%3Cpath%20d%3D'M12%2016.2v.1'%2F%3E%3C%2Fsvg%3E");color:var(--stop-ink,var(--stop))}
.sg-work svg{animation:none}
</style>
</helmet>
<div style="position: relative; min-height: 900px">
<dc-import name="ScreenGrid" theme="{{theme}}" hint-size="100%,900px"></dc-import>
<div class="pal {{palCls}}" style="position: absolute; inset: 0; display: flex; justify-content: center; align-items: flex-start; padding: 110px 16px 16px">
<div style="position: absolute; inset: 0; background: var(--scrim)"></div>
<div role="dialog" aria-modal="true" aria-label="Command palette" style="position: relative; width: 100%; max-width: 640px; background: var(--raised); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow-2); overflow: hidden; display: flex; flex-direction: column">
<div style="height: 48px; display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid var(--border)">
<svg class="ico c3" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
<input aria-label="Search threads and commands" value="dra" style="flex: 1; border: 0; background: transparent; color: var(--t1); font: inherit; font-size: 15px; outline: none">
<span class="kbd">Esc</span>
</div>
<div role="listbox" aria-label="Results" style="padding: 6px; display: flex; flex-direction: column; gap: 1px">
<span class="lbl" style="padding: 6px 10px 4px">Threads</span>
<div class="opt on" role="option" aria-selected="true"><span class="sg sg-work" role="img" aria-label="Running"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="4.7" fill="none" stroke="var(--accent-ink)" stroke-width="1.2" stroke-dasharray="1.75 1.93" stroke-linecap="round"></circle></svg></span><span class="trunc">Split <mark>dra</mark>wer state from the thread store</span><span class="c3" style="font-size: 12px">v2 port</span><span class="kbd">Enter</span></div>
<div class="opt" role="option" aria-selected="false"><span class="sg" aria-hidden="true"></span><span class="trunc">Port upstream <mark>dra</mark>wer tests</span><span class="c3" style="font-size: 12px">v2 port</span></div>
<div class="opt" role="option" aria-selected="false"><span class="sg sg-needs" role="img" aria-label="Needs you"><i></i></span><span class="trunc"><mark>Dra</mark>ft release notes for 0.9</span><span class="c3" style="font-size: 12px">houston-site</span></div>
<span class="lbl" style="padding: 10px 10px 4px">Commands</span>
<div class="opt" role="option" aria-selected="false"><svg class="ico ico-s c2" viewBox="0 0 24 24" aria-hidden="true"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" x2="20" y1="19" y2="19"></line></svg><span class="trunc">Toggle terminal <mark>dra</mark>wer</span><span class="kbd">Ctrl</span><span class="kbd">J</span></div>
<div class="opt" role="option" aria-selected="false"><svg class="ico ico-s c2" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v14"></path><path d="M5 10h14"></path><path d="M5 21h14"></path></svg><span class="trunc">Show changes for this thread</span><span class="kbd">Ctrl</span><span class="kbd">D</span></div>
<div class="opt" role="option" aria-selected="false"><svg class="ico ico-s c2" viewBox="0 0 24 24" aria-hidden="true"><rect width="7" height="7" x="3" y="3" rx="1"></rect><rect width="7" height="7" x="14" y="3" rx="1"></rect><rect width="7" height="7" x="14" y="14" rx="1"></rect><rect width="7" height="7" x="3" y="14" rx="1"></rect></svg><span class="trunc">Move thread to grid…</span></div>
</div>
<div style="height: 36px; display: flex; align-items: center; gap: 14px; padding: 0 14px; border-top: 1px solid var(--border)" class="c3">
<span style="display: inline-flex; gap: 4px; align-items: center; font-size: 12px"><span class="kbd">↑</span><span class="kbd">↓</span>Move</span>
<span style="display: inline-flex; gap: 4px; align-items: center; font-size: 12px"><span class="kbd">Enter</span>Open</span>
<span style="display: inline-flex; gap: 4px; align-items: center; font-size: 12px"><span class="kbd">Ctrl</span><span class="kbd">Enter</span>Open in a new pane</span>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["graphite","paper"],"default":"graphite"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme ?? 'graphite';
    return { theme, palCls: theme === 'paper' ? 'pal-p' : 'pal-g' };
  }
}
</script>
</body>
</html>
