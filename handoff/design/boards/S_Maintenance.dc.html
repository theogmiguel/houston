body{margin:0}
[data-theme=graphite]{color-scheme:dark;color:rgba(255,255,255,.92);--rail:#1c1c1f;--content:#161618;--card:#202023;--raised:#26262a;--border:rgba(255,255,255,.09);--border-hover:rgba(255,255,255,.16);--line-strong:rgba(255,255,255,.16);--field:rgba(255,255,255,.06);--hover:rgba(255,255,255,.05);--sel:rgba(255,255,255,.09);--accent:#2f6fe8;--accent-hover:#4f85ec;--accent-ink:#64a0ff;--accent-muted:rgba(47,111,232,.15);--t1:rgba(255,255,255,.92);--t2:rgba(255,255,255,.66);--t3:rgba(255,255,255,.52);--warn:#f5a524;--stop:#ff6b61;--ok-ink:#30d158;--stop-ink:#ff6b61;--warn-wash:rgba(245,165,36,.08);--warn-line:rgba(245,165,36,.32);--add-bg:rgba(48,209,88,.10);--del-bg:rgba(255,107,97,.10);--code-bg:#18181b;--shadow-1:0 12px 32px -8px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.08);--pane:#0f0f11;--pane-head:#18181b;--term:#0f0f11;--ok:#30d158;--shadow-2:0 12px 32px -8px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.08);--scrim:rgba(0,0,0,.28);--danger-fill:#d93a30;--danger-wash:rgba(255,107,97,.10);--tog-off:rgba(255,255,255,.18);--claude:#d97757;--codex:rgba(255,255,255,.92);--composer:#18181b}
