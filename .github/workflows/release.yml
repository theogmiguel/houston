name: Release

# Push a v* tag -> this builds both OSes' bundles -> files a DRAFT GitHub
# Release. Houston's own update check reads the published release; it never
# consults this workflow.
on:
  # TRIGGERS a real release run — do not push a v* tag before you mean it.
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and upload artifacts only; do not create a GitHub Release'
        type: boolean
        default: true

permissions:
  contents: write

# Version-PINNED, not a caret range — an unpinned CLI would change the bundle
# under us. The one source of truth; a job output (below) is the only way to
# hand it to a called workflow, since a reusable workflow's `with:` can't resolve `env`.
env:
  TAURI_CLI_VERSION: 2.11.4

jobs:
  version-guard:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      previous_tag: ${{ steps.check.outputs.previous_tag }}
      tauri_cli_version: ${{ steps.pin.outputs.tauri_cli_version }}
    steps:
      - name: Record start time
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - id: pin
        run: echo "tauri_cli_version=$TAURI_CLI_VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          # Full history and tags: the previous stable tag bounds the range the
          # generated release notes cover.
          fetch-depth: 0
      - id: check
        run: |
          set -euo pipefail
          conf=$(jq -r .version src-tauri/tauri.conf.json)
          crate=$(sed -n '0,/^version = /s/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml)
          ui=$(jq -r .version ui/package.json)
          # Scoped to the [workspace.package] table: core/Cargo.toml also
          # carries `version = ` lines under [workspace.dependencies], and an
          # unscoped first-match read picks up whichever comes first.
          core=$(awk '/^\[workspace\.package\]/{f=1;next} /^\[/{f=0} f && /^version = /{gsub(/^version = "|"$/,""); print; exit}' core/Cargo.toml)
          echo "tauri.conf.json=$conf  src-tauri/Cargo.toml=$crate  ui/package.json=$ui  core/Cargo.toml=$core"
          if [ -z "$conf" ] || [ -z "$crate" ] || [ -z "$ui" ] || [ -z "$core" ]; then
            echo "::error::a manifest version came back empty -- expected a semver string in each of the four (got tauri.conf.json='$conf' src-tauri/Cargo.toml='$crate' ui/package.json='$ui' core/Cargo.toml='$core')"
            exit 1
          fi
          if [ "$conf" != "$crate" ] || [ "$conf" != "$ui" ] || [ "$conf" != "$core" ]; then
            echo "::error::version mismatch across the four manifests (tauri.conf.json=$conf src-tauri/Cargo.toml=$crate ui/package.json=$ui core/Cargo.toml=$core) -- they must agree before a release"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$conf" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match manifest version $conf"
              exit 1
            fi
          fi
          # The four above are what the bundle filenames read; both lockfiles
          # carry the workspace crates' own versions and must move with them.
          ./scripts/set-version.sh --check "$conf"
          previous=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vFx "v$conf" | sort -V | tail -n1 || true)
          echo "previous stable tag: ${previous:-none}"
          echo "version=$conf" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$previous" >> "$GITHUB_OUTPUT"

      - name: Require the updater signing secrets for a real release
        if: github.ref_type == 'tag' && inputs.dry_run != true
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] || missing+=(TAURI_SIGNING_PRIVATE_KEY)
          [ -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ] || missing+=(TAURI_SIGNING_PRIVATE_KEY_PASSWORD)
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::this release is signed and the updater secrets are missing: ${missing[*]}. Set them under Settings -> Secrets and variables -> Actions; latest.json cannot carry a verifiable signature without them."
            exit 1
          fi

      - name: Record job timing
        if: always()
        continue-on-error: true
        run: |
          elapsed=$(( $(date +%s) - JOB_START ))
          {
            echo "| Job | Elapsed (s) |"
            echo "|---|---|"
            echo "| version-guard | $elapsed |"
          } >> "$GITHUB_STEP_SUMMARY"

  linux-bundle:
    needs: version-guard
    uses: ./.github/workflows/release-linux.yml
    with:
      version: ${{ needs.version-guard.outputs.version }}
      tauri_cli_version: ${{ needs.version-guard.outputs.tauri_cli_version }}
      require_signing: ${{ github.ref_type == 'tag' && inputs.dry_run != true }}
    secrets: inherit

  windows-bundle:
    needs: version-guard
    uses: ./.github/workflows/release-windows.yml
    with:
      version: ${{ needs.version-guard.outputs.version }}
      tauri_cli_version: ${{ needs.version-guard.outputs.tauri_cli_version }}
      # A manual dry run exercises the build without the signing secrets; a tag
      # push is the real thing and signs.
      require_signing: ${{ github.ref_type == 'tag' && inputs.dry_run != true }}
    secrets: inherit

  publish:
    needs: [version-guard, linux-bundle, windows-bundle]
    if: github.ref_type == 'tag' && inputs.dry_run != true
    uses: ./.github/workflows/release-publish.yml
    with:
      tag: ${{ github.ref_name }}
      version: ${{ needs.version-guard.outputs.version }}
      title: Houston ${{ github.ref_name }}
      previous_tag: ${{ needs.version-guard.outputs.previous_tag }}
      draft: true
      # A hand-pushed rc tag gets the same rule as Cut release: publishing the
      # draft must never let releases/latest offer a candidate to stable installs.
      prerelease: ${{ contains(needs.version-guard.outputs.version, '-rc.') }}
