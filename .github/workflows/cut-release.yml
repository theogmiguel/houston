name: Cut release

# Manual only, and deliberate: this workflow pushes a commit to main and a v*
# tag, so nothing but a maintainer clicking Run should ever start it.
on:
  workflow_dispatch:
    inputs:
      kind:
        description: 'Version bump to cut'
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major
          - rc
      ref:
        description: 'Branch, tag or SHA to cut from'
        type: string
        default: 'main'
        required: true
      resume_tag:
        description: 'Existing tag whose builds failed; skips version computation, commit and push'
        type: string
        required: false
        default: ''
      include_windows:
        description: 'Build and publish the Windows installer (currently not at parity; expect it to fail)'
        type: boolean
        default: false
        required: true

permissions:
  contents: write

# One cut at a time: two cuts minutes apart both read the tags and can compute
# the same version before either pushes. Queue, never cancel -- a cut that has
# pushed a tag must not be killed; an rc queuing behind a stable cut is intended.
concurrency:
  group: release-cut
  cancel-in-progress: false

# Version-PINNED, not a caret range, so the bundle cannot change under us. A job
# output (below) is the only way to hand it to a called workflow, since a
# reusable workflow's `with:` cannot resolve `env`.
env:
  TAURI_CLI_VERSION: 2.11.4

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version || steps.resume_version.outputs.version }}
      tag: ${{ steps.version.outputs.tag || steps.resume_version.outputs.tag }}
      previous_tag: ${{ steps.version.outputs.previous_tag || steps.resume_version.outputs.previous_tag }}
      tauri_cli_version: ${{ steps.pin.outputs.tauri_cli_version }}
    steps:
      - name: Record start time
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - id: pin
        run: echo "tauri_cli_version=$TAURI_CLI_VERSION" >> "$GITHUB_OUTPUT"

      # First, before the version is computed, the commit is made or the tag is
      # pushed: a cut that cannot be published signed must not move anything.
      - name: Require the release secrets
        env:
          RELEASE_PUSH_SSH_KEY: ${{ secrets.RELEASE_PUSH_SSH_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$RELEASE_PUSH_SSH_KEY" ] || missing+=(RELEASE_PUSH_SSH_KEY)
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] || missing+=(TAURI_SIGNING_PRIVATE_KEY)
          [ -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ] || missing+=(TAURI_SIGNING_PRIVATE_KEY_PASSWORD)
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::release secrets are missing: ${missing[*]}. Set them under Settings -> Secrets and variables -> Actions; the cut cannot update protected main or publish verifiable artifacts without them."
            exit 1
          fi

      # A resume rebuilds an existing tag; the tag must exist on origin and must
      # not name a release that is already public. A draft is replaceable.
      - name: Refuse an unknown resume tag
        if: inputs.resume_tag != ''
        env:
          RESUME_TAG: ${{ inputs.resume_tag }}
        run: |
          set -euo pipefail
          if ! git ls-remote --exit-code --tags origin "refs/tags/$RESUME_TAG" >/dev/null 2>&1; then
            echo "::error::resume_tag \"$RESUME_TAG\" does not exist on origin; push the tag or clear resume_tag"
            exit 1
          fi

      - name: Refuse to resume a published release
        if: inputs.resume_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_TAG: ${{ inputs.resume_tag }}
        run: |
          set -euo pipefail
          if gh release view "$RESUME_TAG" >/dev/null 2>&1; then
            if [ "$(gh release view "$RESUME_TAG" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "::error::release $RESUME_TAG is already public; a resumed cut may only replace a draft"
              exit 1
            fi
          fi

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # A resume checks out the tag it rebuilds; a normal cut the dispatch ref.
          ref: ${{ inputs.resume_tag != '' && inputs.resume_tag || inputs.ref }}
          ssh-key: ${{ secrets.RELEASE_PUSH_SSH_KEY }}

      - name: Resolve the refs and decide whether main may move
        if: inputs.resume_tag == ''
        env:
          KIND: ${{ inputs.kind }}
        run: |
          set -euo pipefail
          cut_sha=$(git rev-parse HEAD)
          main_sha=$(git rev-parse origin/main)
          if [ "$cut_sha" = "$main_sha" ]; then
            MOVE_MAIN=1
          else
            MOVE_MAIN=0
          fi
          # The rule this workflow exists to keep: main is never rewritten from a
          # ref that is not its own tip. Only a release candidate may come off a
          # side ref; a stable release is cut from the tip of main and nothing else.
          if [ "$MOVE_MAIN" -eq 0 ] && [ "$KIND" != "rc" ]; then
            echo "::error::ref resolves to $cut_sha but origin/main is $main_sha -- a stable release is cut from the tip of main and nothing else; only a release candidate may come off a side ref"
            exit 1
          fi
          {
            echo "MOVE_MAIN=$MOVE_MAIN"
            echo "CUT_SHA=$cut_sha"
            echo "MAIN_SHA=$main_sha"
          } >> "$GITHUB_ENV"

      - name: Compute the next version
        id: version
        if: inputs.resume_tag == ''
        env:
          KIND: ${{ inputs.kind }}
        run: |
          set -euo pipefail
          # sort -V over the stripped numbers, not lexical: 0.10.0 must beat 0.9.0.
          latest_stable=$(git tag -l 'v*' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sed -E 's/^v//' \
            | sort -V \
            | tail -n1 || true)
          previous_tag=""
          if [ -z "$latest_stable" ]; then
            latest_stable="0.0.0"
            echo "no stable tag found; treating the latest stable as 0.0.0"
          else
            previous_tag="v$latest_stable"
          fi
          echo "latest stable: $latest_stable (kind=$KIND)"
          IFS=. read -r major minor patch <<< "$latest_stable"

          case "$KIND" in
            patch) version="$major.$minor.$((patch + 1))" ;;
            minor) version="$major.$((minor + 1)).0" ;;
            major) version="$((major + 1)).0.0" ;;
            rc)
              # Continue the highest rc series whose base already sits above
              # latest_stable; with no such series, start a fresh one at the next
              # minor above latest_stable, -rc.1.
              rc_bases=$(git tag -l 'v*' \
                | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$' \
                | sed -E 's/^v//; s/-rc\.[0-9]+$//' \
                | sort -Vu || true)
              rc_base=""
              while IFS= read -r base; do
                [ -n "$base" ] || continue
                [ "$base" = "$latest_stable" ] && continue
                higher=$(printf '%s\n%s\n' "$latest_stable" "$base" | sort -V | tail -n1)
                if [ "$higher" = "$base" ]; then rc_base="$base"; fi
              done <<< "$rc_bases"
              if [ -n "$rc_base" ]; then
                highest_n=$(git tag -l "v$rc_base-rc.*" \
                  | sed -E 's/^v.*-rc\.//' \
                  | sort -V \
                  | tail -n1)
                version="$rc_base-rc.$((highest_n + 1))"
              else
                version="$major.$((minor + 1)).0-rc.1"
              fi
              ;;
            *)
              echo "::error::unknown kind \"$KIND\" -- expected one of patch, minor, major, rc"
              exit 1
              ;;
          esac

          # Explicit comparison, not a side effect of the arithmetic: a stable
          # kind that fails to move the number forward stops here.
          if [ "$KIND" != "rc" ]; then
            higher=$(printf '%s\n%s\n' "$latest_stable" "$version" | sort -V | tail -n1)
            if [ "$higher" != "$version" ] || [ "$version" = "$latest_stable" ]; then
              echo "::error::computed $version for kind=$KIND is not strictly greater than latest_stable $latest_stable"
              exit 1
            fi
          fi

          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::tag $tag already exists"
            exit 1
          fi
          echo "previous tag for the generated notes: ${previous_tag:-none}"
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "previous_tag=$previous_tag"
          } >> "$GITHUB_OUTPUT"
          echo "next version: $version (tag $tag)"

      # The checked-out tree must be the release commit the tag names; the
      # script refuses a mismatch and prints the agreed version.
      - name: Resume the existing tag
        id: resume_version
        if: inputs.resume_tag != ''
        env:
          RESUME_TAG: ${{ inputs.resume_tag }}
        run: |
          set -euo pipefail
          version="${RESUME_TAG#v}"
          ./scripts/check-manifest-versions.sh "$version" >/dev/null
          previous=$(git tag -l 'v*' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | grep -vFx "$RESUME_TAG" \
            | sort -V \
            | tail -n1 || true)
          {
            echo "version=$version"
            echo "tag=$RESUME_TAG"
            echo "previous_tag=$previous"
          } >> "$GITHUB_OUTPUT"
          {
            echo "resumed tag $RESUME_TAG: rebuilding only, no version computation,"
            echo "commit or push. kind and ref are ignored on a resume."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "resuming $RESUME_TAG (version $version, previous tag ${previous:-none})"

      - uses: dtolnay/rust-toolchain@stable

      - name: Write the version into the manifests and both lockfiles
        if: inputs.resume_tag == ''
        run: ./scripts/set-version.sh "${{ steps.version.outputs.version }}"

      - name: Commit and tag
        if: inputs.resume_tag == ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Named, not `git add -A`: a release commit carries the version bump
          # and nothing a runner happened to leave behind.
          git add src-tauri/tauri.conf.json src-tauri/Cargo.toml \
            src-tauri/Cargo.lock ui/package.json core/Cargo.toml core/Cargo.lock
          git commit -m "release: v$VERSION"
          git tag -m "release: v$VERSION" "v$VERSION"

      - name: Push the commit and the tag
        if: inputs.resume_tag == ''
        env:
          TAG: ${{ steps.version.outputs.tag }}
          CUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          if [ "$MOVE_MAIN" = "1" ]; then
            # Atomic keeps a rejected tag from leaving main on a release commit
            # that no tag names, or vice versa.
            git push --atomic origin HEAD:main "$TAG"
          else
            git push origin "$TAG"
            {
              echo "main was deliberately not moved: this release candidate was cut from $CUT_REF (${CUT_SHA}),"
              echo "not from main (${MAIN_SHA}), and the tag $TAG now exists."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Record job timing
        if: always()
        continue-on-error: true
        run: |
          elapsed=$(( $(date +%s) - JOB_START ))
          {
            echo "| Job | Elapsed (s) |"
            echo "|---|---|"
            echo "| prepare | $elapsed |"
          } >> "$GITHUB_STEP_SUMMARY"

  # Both bundle jobs build the tag prepare resolved or resumed, not the dispatch
  # ref: the release commit holds the manifests at the new version, and building
  # anything else ships a bundle whose filename and runtime version disagree.
  linux-bundle:
    needs: prepare
    uses: ./.github/workflows/release-linux.yml
    with:
      ref: ${{ needs.prepare.outputs.tag }}
      version: ${{ needs.prepare.outputs.version }}
      tauri_cli_version: ${{ needs.prepare.outputs.tauri_cli_version }}
      require_signing: true
    secrets: inherit

  windows-bundle:
    needs: prepare
    if: inputs.include_windows
    uses: ./.github/workflows/release-windows.yml
    with:
      ref: ${{ needs.prepare.outputs.tag }}
      version: ${{ needs.prepare.outputs.version }}
      tauri_cli_version: ${{ needs.prepare.outputs.tauri_cli_version }}
      require_signing: true
    secrets: inherit

  publish:
    # The cut builds and publishes its own tag: no other workflow watches for
    # the push, so a run that stopped after the push would ship nothing.
    needs: [prepare, linux-bundle, windows-bundle]
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.linux-bundle.result == 'success' &&
      (inputs.include_windows != true || needs.windows-bundle.result == 'success')
    uses: ./.github/workflows/release-publish.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      version: ${{ needs.prepare.outputs.version }}
      title: Houston ${{ needs.prepare.outputs.tag }}
      previous_tag: ${{ needs.prepare.outputs.previous_tag }}
      draft: true
      include_windows: ${{ inputs.include_windows }}
      replace_existing: ${{ inputs.resume_tag != '' }}
      # An rc is a prerelease; on a resume the tag itself says so, since kind is
      # ignored then.
      prerelease: ${{ contains(inputs.resume_tag, '-rc.') || (inputs.resume_tag == '' && inputs.kind == 'rc') }}
