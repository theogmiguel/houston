name: Create release draft (internal)

# The one job that writes outward-facing state: it verifies the artifact set
# both bundle workflows uploaded, preserves the prepared or reviewed notes,
# and files the draft with latest.json built from verified signatures.
on:
  workflow_call:
    inputs:
      tag:
        description: 'Git tag the release is filed under (vX.Y.Z or vX.Y.Z-rc.N)'
        type: string
        required: true
      version:
        description: 'Version latest.json advertises; may carry the -rc.N suffix'
        type: string
        required: true
      title:
        description: 'Release title'
        type: string
        required: true
      prerelease:
        description: 'Mark as a prerelease; releases/latest is documented to skip those'
        type: boolean
        required: true
      replace_existing:
        description: 'Resume an existing draft, preserving its reviewed notes and release identity'
        type: boolean
        required: false
        default: false
      include_windows:
        description: 'Require and publish the Windows installer alongside Linux'
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency:
      group: release-state-${{ inputs.tag }}
      cancel-in-progress: false
    steps:
      - name: Record start time
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5

      - name: Install signature verifier
        run: sudo apt-get update && sudo apt-get install -y minisign

      # Only the bundles: the run also holds the raw Linux daemon the Windows
      # installer embeds, which is no release asset.
      - uses: actions/download-artifact@v7
        with:
          pattern: houston-*
          path: artifacts
          merge-multiple: true

      - name: Download the prepared release notes
        uses: actions/download-artifact@v7
        with:
          name: release-notes-${{ inputs.tag }}
          path: prepared-notes
      - name: Preserve any reviewed draft description
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          RESUME: ${{ inputs.replace_existing }}
        run: |
          args=()
          if [ "$RESUME" = true ]; then args+=(--resume); fi
          python3 scripts/release-draft.py notes --repository "$GITHUB_REPOSITORY" --tag "$TAG" --generated prepared-notes/notes.md --output notes.md "${args[@]}"

      # The generator below is the gate that decides what ships; its focused
      # tests run first so a broken refusal cannot be discovered by an artifact
      # set it wrongly accepts. Uses local signature fixtures and no network.
      - name: Test the manifest generator
        run: python3 scripts/test-update-manifest.py

      # Strict on purpose: a missing bundle, a missing .sig, a filename from
      # another version or any unrecognised file refuses here, before anything
      # is filed. The script's errors name the offending file.
      - name: Verify the artifacts and build latest.json
        run: |
          set -euo pipefail
          args=(
            --repository "$GITHUB_REPOSITORY"
            --tag "${{ inputs.tag }}"
            --version "${{ inputs.version }}"
            --notes-file notes.md
            --artifacts-dir artifacts
            --output artifacts/latest.json
          )
          if [ "${{ inputs.include_windows }}" != "true" ]; then
            args+=(--linux-only)
          fi
          python3 scripts/gen-update-manifest.py "${args[@]}"

      - name: Create or update the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TITLE: ${{ inputs.title }}
          PRERELEASE: ${{ inputs.prerelease }}
          RESUME: ${{ inputs.replace_existing }}
        run: |
          args=()
          if [ "$RESUME" = true ]; then args+=(--resume); fi
          if [ "$PRERELEASE" = true ]; then args+=(--prerelease); fi
          python3 scripts/release-draft.py file --repository "$GITHUB_REPOSITORY" --tag "$TAG" --title "$TITLE" --notes-file notes.md --artifacts artifacts "${args[@]}"
          {
            echo "## Draft ready: $TAG"
            echo "Open the [draft](https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG), review its notes, and download and test the installers."
            echo "Then run [Promote draft to public](https://github.com/$GITHUB_REPOSITORY/actions/workflows/publish-draft.yml) with tag $TAG and smoke_tested checked. Approve stable-release when prompted."
            echo "Publishing synchronizes the reviewed notes with latest.json; editing the draft alone does not publish it."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record job timing
        if: always()
        continue-on-error: true
        run: |
          elapsed=$(( $(date +%s) - JOB_START ))
          {
            echo "| Job | Elapsed (s) |"
            echo "|---|---|"
            echo "| publish | $elapsed |"
          } >> "$GITHUB_STEP_SUMMARY"
