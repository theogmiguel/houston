name: CI

# Public and fork-gated: PRs run safety scripts, core suites and every Linux
# houston-core integration test. Load-sensitive gates stay local (docs/operations/development.md).
# Windows runs core unit tests and portable ConPTY regressions.
on:
  pull_request: {}
  push:
    branches: [main]
    # Push only, not pull_request: once these jobs are required checks, a
    # docs-only PR that skipped them via paths-ignore could never satisfy a
    # required check and would never merge.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

# A superseded run is wasted Actions minutes: cancel the previous run for this ref
# when a new commit lands on it. Keyed per PR (or per ref for pushes) so unrelated
# work is never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Cheapest and most consequential job: hermetic, sub-second text-search invariants.
  # Runs first so a violated safety rule fails fast, before any crate builds.
  safety-checks:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    env:
      HOUSTON_CHANNEL: dev
    steps:
      # Job-level elapsed time via one timestamp diff — GitHub only exposes per-step
      # durations through the Jobs API after each step completes, which needs a
      # token call for a number this gets for free.
      - name: Record job start time
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
        with:
          # Ratchets compare origin/<base> (PR) or HEAD~1 (push), so they need history.
          # The root commit is the one exception: it records the first baseline.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate workflow syntax and reusable workflow contracts
        run: |
          tool_dir="$RUNNER_TEMP/actionlint"
          mkdir -p "$tool_dir"
          curl --fail --silent --show-error --location https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz --output "$tool_dir/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $tool_dir/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$tool_dir/actionlint.tar.gz" -C "$tool_dir" actionlint
          "$tool_dir/actionlint" -shellcheck= -pyflakes=
      - name: Test updater signature verification and release manifests
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign
          python3 scripts/test-update-manifest.py
          python3 scripts/test-release-helper.py
          python3 scripts/test-release-draft.py
      - name: Validate the PR release notes
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/release-pr.json"
          python3 scripts/release-helper.py check-pr --pr-file "$RUNNER_TEMP/release-pr.json"
      - name: check-dev-channel.sh (dev.sh channel resolution)
        run: bash scripts/check-dev-channel.sh
      - name: check-kill-guard.sh (kill(2) broadcast guard)
        run: bash scripts/check-kill-guard.sh
      - name: check-case-collisions.sh (paths unique on case-insensitive filesystems)
        run: bash scripts/check-case-collisions.sh
      - name: check-spawn-window.sh (CREATE_NO_WINDOW lint config still armed)
        run: bash scripts/check-spawn-window.sh
      - name: check-env-ratchet.sh (direct process-environment access only goes down)
        run: bash scripts/check-env-ratchet.sh
      # v2 carries handoff/ until it merges; v2-checks.yml runs this check without it.
      - name: check-doc-hygiene.sh (Markdown tree shape, plan cap, no diary content)
        if: github.head_ref != 'v2' && !startsWith(github.head_ref, 'v2-')
        run: bash scripts/check-doc-hygiene.sh
      - name: check-comment-hygiene.sh (no dates/phases/diary/app names in code comments)
        run: bash scripts/check-comment-hygiene.sh
      - name: check-web-style.sh (apps/web design-system guards, baseline ratchet)
        run: bash scripts/check-web-style.sh --all
      - name: check-web-style.sh --self-test (each guard fires on its bad fixture)
        run: bash scripts/check-web-style.sh --self-test
      - name: Report job timing
        if: always()
        continue-on-error: true
        run: |
          elapsed=$(( $(date +%s) - JOB_START ))
          {
            echo "### ${{ github.job }} timing"
            echo "| job | elapsed (s) |"
            echo "|---|---|"
            echo "| ${{ github.job }} | $elapsed |"
          } >> "$GITHUB_STEP_SUMMARY"

  # Core formatting, Clippy, unit tests and doctests; the integration suites run in
  # core-integration.
  core-checks:
    runs-on: ubuntu-latest
    env:
      HOUSTON_CHANNEL: dev
      CARGO_BUILD_JOBS: 3
    steps:
      - name: Record job start time
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
      # The runner ships none of the -dev headers these -sys crates need, so the
      # job would die in clippy rather than a test without them (alsa/dbus/udev/
      # clang/cmake/nasm). gnome-keyring and dbus-x11 are for the test step below.
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libdbus-1-dev libudev-dev \
            clang libclang-dev cmake nasm \
            gnome-keyring dbus-x11 zsh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      # Same pinned tarball + Zig build.rs step the release-linux bundle job
      # caches, scoped to core/ only — src-tauri isn't built here. build.rs keeps
      # Zig's fetched packages in this directory too, so its hash is in the key.
      - name: Cache the pinned libghostty-vt source and Zig
        uses: actions/cache@v5
        with:
          path: core/target/ghostty-vt
          key: ghostty-vt-core-ubuntu-latest-${{ hashFiles('core/houston-core/ghostty-vt.lock', 'core/houston-core/build.rs') }}
      - name: cargo fmt
        run: cargo fmt --all --check --manifest-path core/Cargo.toml
      - name: cargo clippy
        run: cargo clippy --all-targets --manifest-path core/Cargo.toml -- -D warnings
      # Pinned to the version core/.config/nextest.toml requires.
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.148
      # voice::cloud's tests talk to a Secret Service the runner has none of; a
      # private session bus with gnome-keyring unlocked is the same fix the local
      # Linux gate uses. No oom-shield here — that's a local-machine concern.
      - name: cargo nextest --lib
        run: |
          # shellcheck disable=SC2016
          dbus-run-session -- bash -c '
            eval "$(echo -n "" | gnome-keyring-daemon --unlock --components=secrets 2>/dev/null)"
            cargo nextest run --profile ci --lib --manifest-path core/Cargo.toml'
      # nextest does not run documentation tests.
      - name: cargo test --doc
        run: cargo test --doc --locked --manifest-path core/Cargo.toml
      - name: Report job timing
        if: always()
        continue-on-error: true
        run: |
          elapsed=$(( $(date +%s) - JOB_START ))
          {
            echo "### ${{ github.job }} timing"
            echo "| job | elapsed (s) |"
            echo "|---|---|"
            echo "| ${{ github.job }} | $elapsed |"
          } >> "$GITHUB_STEP_SUMMARY"

  # Every houston-core integration test, the `it` binary included, on Linux. The suites
  # boot real daemons and PTYs and take a while, so this runs beside core-checks rather
  # than inside it. The Windows job below keeps its own selection.
  core-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HOUSTON_CHANNEL: dev
      CARGO_BUILD_JOBS: 3
    steps:
      - name: Record job start time
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libdbus-1-dev libudev-dev \
            clang libclang-dev cmake nasm \
            gnome-keyring dbus-x11 zsh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: core-integration
      - name: Cache the pinned libghostty-vt source and Zig
        uses: actions/cache@v5
        with:
          path: core/target/ghostty-vt
          key: ghostty-vt-core-ubuntu-latest-${{ hashFiles('core/houston-core/ghostty-vt.lock', 'core/houston-core/build.rs') }}
      # Pinned to the version core/.config/nextest.toml requires.
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.148
      # --no-fail-fast reports every failing test in one run. The restored-CLI
      # regressions in resume_wire run real bash and zsh integration rc files.
      - name: cargo nextest (all houston-core tests)
        run: >
          bash scripts/with-test-keyring.sh cargo nextest run --profile ci --locked
          --no-fail-fast --manifest-path core/Cargo.toml -p houston-core
      - name: Report job timing
        if: always()
        continue-on-error: true
        run: |
          elapsed=$(( $(date +%s) - JOB_START ))
          {
            echo "### ${{ github.job }} timing"
            echo "| job | elapsed (s) |"
            echo "|---|---|"
            echo "| ${{ github.job }} | $elapsed |"
          } >> "$GITHUB_STEP_SUMMARY"

  linux-native-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HOUSTON_CHANNEL: dev
      CARGO_BUILD_JOBS: 3
    steps:
      - uses: actions/checkout@v5
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev \
            libasound2-dev libdbus-1-dev libudev-dev \
            clang libclang-dev cmake nasm gnome-keyring dbus-x11 zsh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core
            src-tauri
          key: linux-native-checks
      # houston-core's build.rs resolves its cache next to the cargo target dir of
      # the crate being built, which here is src-tauri/target.
      - name: Cache the pinned libghostty-vt source and Zig
        uses: actions/cache@v5
        with:
          path: src-tauri/target/ghostty-vt
          key: ghostty-vt-src-tauri-ubuntu-latest-${{ hashFiles('core/houston-core/ghostty-vt.lock', 'core/houston-core/build.rs') }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      # tauri.conf.json's frontendDist is the upstream web app's dist directory,
      # which generate_context! requires at compile time.
      - name: Build renderer assets for native compilation
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @t3tools/web build
      - name: Check native formatting and Clippy
        run: |
          cargo fmt --all --check --manifest-path src-tauri/Cargo.toml
          cargo clippy --locked --all-targets --manifest-path src-tauri/Cargo.toml -- -D warnings
      - name: Test native application
        run: |
          bash scripts/with-test-keyring.sh cargo test --locked --manifest-path src-tauri/Cargo.toml -- --test-threads=3

  windows-checks:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      HOUSTON_CHANNEL: dev
      CARGO_BUILD_JOBS: 3
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Record job start time
        run: '"JOB_START=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" >> $env:GITHUB_ENV'
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core
            src-tauri
          key: windows-checks
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      # tauri.conf.json's frontendDist is the upstream web app's dist directory,
      # which generate_context! requires at compile time.
      - name: Build renderer assets for native compilation
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @t3tools/web build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Check core formatting and Clippy
        working-directory: core
        run: |
          cargo fmt --all --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo clippy --locked --all-targets -- -D warnings
          exit $LASTEXITCODE
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.148
      - name: Test core
        working-directory: core
        run: |
          cargo nextest run --profile ci --locked -p houston-core --lib
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo nextest run --profile ci --locked --no-fail-fast -p houston-core -E 'test(/^protocol_version_wire::/) | test(/^env_hygiene_wire::/) | test(/^nonascii_longpath_wire::/) | test(/^checkpoints_wire::/) | test(/^git_discard_wire::/) | test(/^git_tools_wire::/) | test(/^git_wire::/) | test(/^manage_wire::/) | test(/^shutdown_drain_wire::/) | test(/^subprocess_deadlines_windows::/) | test(/^tasks_wire::/) | test(/^windows_claude_hooks_wire::/) | test(/^windows_codex_hooks_wire::/) | test(/^windows_codex_launch_wire::/) | test(/^windows_instruction_submit::/) | test(/^launch_prompt_isolation::/) | test(/^claude_turns_wire::/) | test(/^session_activity::/) | test(/^generated_titles::/) | test(/^recovery_ownership::/) | test(/^voice_model_reuse::/) | test(/^windows_orchestration_wire::/) | test(/^wsl_wire::/)'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo nextest run --profile ci --locked -p houston-core --features test-barriers -E 'test(/^ssh_stalled_window::/) | test(/^windows_pty_lifecycle::/)'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked -p houston-core --doc
          exit $LASTEXITCODE
      - name: Check native application
        working-directory: src-tauri
        run: |
          cargo fmt --all --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo clippy --locked --all-targets -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked -- --test-threads=3
          exit $LASTEXITCODE
      - name: Report job timing
        if: always()
        continue-on-error: true
        run: |
          $elapsed = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds() - [long]$env:JOB_START
          "| Job | Elapsed (s) |`n|---|---|`n| windows-checks | $elapsed |" >> $env:GITHUB_STEP_SUMMARY

  # The committed third-party inventory is generated from every dependency graph
  # at once: the Rust toolchain (cargo metadata, no build), the renderer's
  # node_modules and the pnpm workspace's node_modules — no other job has all three.
  licence-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # No components and no build cache: `cargo metadata` resolves the graph and
      # compiles nothing, so a restore-and-save cycle would cost more than it saves.
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: check-third-party-licenses.sh (committed inventory matches the dependency graphs)
        run: ./scripts/check-third-party-licenses.sh
