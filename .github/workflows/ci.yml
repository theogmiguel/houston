name: CI

# The single gate for pull requests and pushes to v2 and main. Heavy jobs run on
# the runner variables documented in docs/internals/ci.md, so switching to a
# faster provider is a repository-variable change rather than a workflow edit.
on:
  pull_request:
    branches: [v2, main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [v2, main]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

# A superseded PR run is wasted minutes, so cancel it. A push run may be the
# source a release is cut from, so key it by SHA and never cancel it.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-push-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  HOUSTON_CHANNEL: dev

jobs:
  # Cheap path filter every other job waits on. The script fails closed, so a
  # diff it cannot classify runs the full suite instead of skipping work.
  changes:
    runs-on: ${{ vars.CI_RUNNER_LINUX_SMALL || 'ubuntu-24.04' }}
    # A checkout plus one diff; measured under a minute.
    timeout-minutes: 5
    outputs:
      web: ${{ steps.changes.outputs.web }}
      server: ${{ steps.changes.outputs.server }}
      packages: ${{ steps.changes.outputs.packages }}
      native: ${{ steps.changes.outputs.native }}
      workflows: ${{ steps.changes.outputs.workflows }}
      deps: ${{ steps.changes.outputs.deps }}
      docs_only: ${{ steps.changes.outputs.docs_only }}
    steps:
      # Depth 2 gives HEAD (the PR merge commit) and both parents; HEAD^1 is the
      # base tip, so the diff is exactly the PR's own changes. Blobless keeps the
      # fetch small because only paths are read.
      - uses: actions/checkout@v5
        with:
          filter: blob:none
          fetch-depth: 2
      - name: Classify changed paths
        id: changes
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            node scripts/ci/changes.mjs --all >> "$GITHUB_OUTPUT"
          else
            git diff --name-only HEAD^1 HEAD | node scripts/ci/changes.mjs >> "$GITHUB_OUTPUT"
          fi

  # Seconds of hermetic checks, so one machine is cheaper than many queued ones.
  # Licence inventory needs a Rust toolchain only to resolve Cargo metadata.
  static:
    runs-on: ${{ vars.CI_RUNNER_LINUX_SMALL || 'ubuntu-24.04' }}
    permissions:
      contents: read
      pull-requests: read
    # The licence inventory is the long pole, about 2 minutes cold.
    timeout-minutes: 20
    steps:
      - name: Record job start time
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
        with:
          filter: blob:none
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/setup
      # The tree carries pre-existing format findings, so the gate checks the paths this change
      # touches instead of blocking day one.
      - name: Format the changed files
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range=(HEAD^1 HEAD)
          elif [ "$EVENT_NAME" = "push" ] && git rev-parse --verify --quiet HEAD^ >/dev/null; then
            range=(HEAD^ HEAD)
          else
            echo "static: no changed-file range on $EVENT_NAME; skipping the changed-file checks"
            exit 0
          fi
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "${range[@]}" | grep -vE '^handoff/' || true)
          mapfile -t formattable < <(printf '%s\n' "${files[@]}" | grep -E '\.(ts|tsx|js|jsx|mjs|cjs|mts|cts|json|jsonc|css|html?|md|ya?ml)$' || true)
          if [ "${#formattable[@]}" -gt 0 ]; then
            pnpm exec vp fmt --check --no-error-on-unmatched-pattern "${formattable[@]}"
          fi
      # Whole tree, about 16 s: a file may not exceed its error count in scripts/lint-baseline.json.
      - name: Lint ratchet
        run: node scripts/ci/lint-ratchet.mjs
      - name: Validate workflow syntax and reusable workflow contracts
        run: |
          tool_dir="$RUNNER_TEMP/actionlint"
          mkdir -p "$tool_dir"
          curl --fail --silent --show-error --location https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz --output "$tool_dir/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $tool_dir/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$tool_dir/actionlint.tar.gz" -C "$tool_dir" actionlint
          "$tool_dir/actionlint" -shellcheck= -pyflakes=
      - name: Test updater signature verification and release manifests
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign
          python3 scripts/test-update-manifest.py
          python3 scripts/test-release-helper.py
          python3 scripts/test-release-draft.py
      - name: Validate the PR release notes
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/release-pr.json"
          python3 scripts/release-helper.py check-pr --pr-file "$RUNNER_TEMP/release-pr.json"
      - name: check-dev-channel.sh (dev.sh channel resolution)
        run: bash scripts/check-dev-channel.sh
      - name: check-kill-guard.sh (kill(2) broadcast guard)
        run: bash scripts/check-kill-guard.sh
      - name: check-case-collisions.sh (paths unique on case-insensitive filesystems)
        run: bash scripts/check-case-collisions.sh
      - name: check-spawn-window.sh (CREATE_NO_WINDOW lint config still armed)
        run: bash scripts/check-spawn-window.sh
      - name: check-env-ratchet.sh (direct process-environment access only goes down)
        run: bash scripts/check-env-ratchet.sh
      - name: check-comment-hygiene.sh (no dates/phases/diary/app names in code comments)
        run: bash scripts/check-comment-hygiene.sh
      - name: check-web-style.sh (apps/web design-system guards, baseline ratchet)
        run: bash scripts/check-web-style.sh --all
      - name: check-web-style.sh --self-test (each guard fires on its bad fixture)
        run: bash scripts/check-web-style.sh --self-test
      - name: Upstream MIT notice is present
        run: |
          notice='Copyright (c) 2026 T3 Tools Inc.'
          for file in NOTICE third-party-licenses.config.json src-tauri/resources/third-party-licenses.json; do
            if ! grep -qF "$notice" "$file"; then
              echo "static: $file lacks the upstream licence line \"$notice\"; ported code cannot ship without it." >&2
              echo "  Restore it in NOTICE and third-party-licenses.config.json, then run: node scripts/gen-third-party-licenses.mjs" >&2
              exit 1
            fi
          done
          echo "static: upstream MIT notice present in NOTICE and the licence inventory"
      - name: check-third-party-licenses.sh (committed inventory matches the dependency graphs)
        run: ./scripts/check-third-party-licenses.sh
      # handoff/ is working material, so it is dropped from the index and disk
      # before the hygiene scan.
      - name: Drop handoff/ from the checked-out tree
        run: |
          if [ -d handoff ]; then
            git rm -r -q --cached handoff
            rm -rf handoff
          fi
      - name: check-doc-hygiene.sh (Markdown tree shape, no diary content)
        run: bash scripts/check-doc-hygiene.sh
      - name: Report job timing
        if: always()
        continue-on-error: true
        run: |
          elapsed=$(( $(date +%s) - JOB_START ))
          {
            echo "### ${{ github.job }} timing"
            echo "| job | elapsed (s) |"
            echo "|---|---|"
            echo "| ${{ github.job }} | $elapsed |"
          } >> "$GITHUB_STEP_SUMMARY"

  # The whole workspace, one job: each package runs its own typecheck script.
  typecheck:
    needs: changes
    if: >-
      needs.changes.outputs.docs_only != 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft != true)
    runs-on: ${{ vars.CI_RUNNER_LINUX_SMALL || 'ubuntu-24.04' }}
    # The full workspace typecheck measured 92 s uncached.
    timeout-minutes: 20
    steps:
      - name: Record job start time
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
        with:
          filter: blob:none
      - uses: ./.github/actions/setup
      # The root "typecheck" script uses vp run, which cannot resolve a task and a
      # package script with the same name; pnpm runs each package's own script.
      - name: Typecheck the workspace
        run: pnpm -r --no-bail typecheck
      - name: Report job timing
        if: always()
        continue-on-error: true
        run: |
          elapsed=$(( $(date +%s) - JOB_START ))
          {
            echo "### ${{ github.job }} timing"
            echo "| job | elapsed (s) |"
            echo "|---|---|"
            echo "| ${{ github.job }} | $elapsed |"
          } >> "$GITHUB_STEP_SUMMARY"

  # Workspace package suites plus the scripts package's node:test suites; web and
  # server have their own jobs.
  test-packages:
    needs: changes
    if: >-
      needs.changes.outputs.packages == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft != true)
    runs-on: ${{ vars.CI_RUNNER_LINUX_SMALL || 'ubuntu-24.04' }}
    # Package suites plus the node:test script suites; measured in a few minutes.
    timeout-minutes: 30
    steps:
      - name: Record job start time
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
        with:
          filter: blob:none
      - uses: ./.github/actions/setup
      - name: Workspace package tests (web, server and scripts excluded)
        run: pnpm -r --no-bail --no-sort --filter "!@houston-app/web" --filter "!@houston-app/cli" --filter "!@houston-app/scripts" test
      - name: Script tests (licence generator, style guard, desktop packaging)
        run: >-
          node --test scripts/gen-third-party-licenses.test.mjs scripts/check-web-style.test.mjs
          scripts/build-desktop-artifact.test.mjs scripts/refresh-updater-metadata.test.mjs
      - name: Report job timing
        if: always()
        continue-on-error: true
        run: |
          elapsed=$(( $(date +%s) - JOB_START ))
          {
            echo "### ${{ github.job }} timing"
            echo "| job | elapsed (s) |"
            echo "|---|---|"
            echo "| ${{ github.job }} | $elapsed |"
          } >> "$GITHUB_STEP_SUMMARY"

  # One command replaces the nine area jobs. Six shards fit the 4-vCPU runner
  # and keep every shard well under the job timeout.
  test-server:
    needs: changes
    if: >-
      needs.changes.outputs.server == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft != true)
    runs-on: ${{ vars.CI_RUNNER_LINUX || 'ubuntu-24.04' }}
    # The old monolith was 758 s over the same files; six shards leave 3x headroom.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Record job start time
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
        with:
          filter: blob:none
      - uses: ./.github/actions/setup
      - name: Resolve Playwright version
        id: playwright_version
        run: echo "version=$(node -p "require('./apps/server/node_modules/playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium
        id: chromium_cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-shell-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright_version.outputs.version }}
      - name: Install Chromium for server browser integration tests
        if: steps.chromium_cache.outputs.cache-hit != 'true'
        run: node apps/server/node_modules/playwright-core/cli.js install --only-shell chromium
      - name: Install missing Chromium system dependencies
        run: |
          browser=$(find "$HOME/.cache/ms-playwright" -name chrome-headless-shell -type f -print -quit)
          test -n "$browser"
          if ldd "$browser" | grep '=> not found'; then
            node apps/server/node_modules/playwright-core/cli.js install-deps chromium
          fi
      - name: Server tests (src and scripts)
        run: pnpm --filter @houston-app/cli exec vp test run src/ scripts/ --shard=${{ matrix.shard }}/6
      - name: Report job timing
        if: always()
        continue-on-error: true
        run: |
          elapsed=$(( $(date +%s) - JOB_START ))
          {
            echo "### ${{ github.job }} timing"
            echo "| job | elapsed (s) |"
            echo "|---|---|"
            echo "| ${{ github.job }} | $elapsed |"
          } >> "$GITHUB_STEP_SUMMARY"

  # The renderer had no CI coverage: unit tests, browser tests and the production
  # build now run here, so a web-only change is gated without the native jobs.
  test-web:
    needs: changes
    if: >-
      needs.changes.outputs.web == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft != true)
    runs-on: ${{ vars.CI_RUNNER_LINUX_SMALL || 'ubuntu-24.04' }}
    # The renderer build and its unit project; measured in a few minutes.
    timeout-minutes: 25
    steps:
      - name: Record job start time
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
        with:
          filter: blob:none
      - uses: ./.github/actions/setup
      - name: Build the renderer
        run: pnpm --filter @houston-app/web build
      - name: Web unit tests
        run: pnpm --filter @houston-app/web exec vp test run --project unit
      - name: Report job timing
        if: always()
        continue-on-error: true
        run: |
          elapsed=$(( $(date +%s) - JOB_START ))
          {
            echo "### ${{ github.job }} timing"
            echo "| job | elapsed (s) |"
            echo "|---|---|"
            echo "| ${{ github.job }} | $elapsed |"
          } >> "$GITHUB_STEP_SUMMARY"

  test-web-browser:
    needs: changes
    if: >-
      needs.changes.outputs.web == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft != true)
    runs-on: ${{ vars.CI_RUNNER_LINUX || 'ubuntu-24.04' }}
    # Four browser shards; a cold Chromium install dominates the first run.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Record job start time
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
        with:
          filter: blob:none
      - uses: ./.github/actions/setup
      - name: Resolve Playwright version
        id: playwright_version
        run: echo "version=$(node -p "require('./apps/web/node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium
        id: chromium_cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright_version.outputs.version }}
      - name: Install Chromium for browser tests
        if: steps.chromium_cache.outputs.cache-hit != 'true'
        run: node apps/web/node_modules/playwright/cli.js install chromium
      - name: Install missing Chromium system dependencies
        run: |
          browser=$(find "$HOME/.cache/ms-playwright" -type f \( -name chrome -o -name chrome-headless-shell \) -print -quit)
          test -n "$browser"
          if ldd "$browser" | grep '=> not found'; then
            node apps/web/node_modules/playwright/cli.js install-deps chromium
          fi
      # Two workers keep each Chromium page responsive on the 4-vCPU runner: at the default worker count
      # clicks timed out under load; two retries absorb the remaining scheduling noise.
      - name: Web browser tests
        run: pnpm --filter @houston-app/web exec vp test run --project browser --shard=${{ matrix.shard }}/4 --maxWorkers=2 --retry=2
      - name: Report job timing
        if: always()
        continue-on-error: true
        run: |
          elapsed=$(( $(date +%s) - JOB_START ))
          {
            echo "### ${{ github.job }} timing"
            echo "| job | elapsed (s) |"
            echo "|---|---|"
            echo "| ${{ github.job }} | $elapsed |"
          } >> "$GITHUB_STEP_SUMMARY"

  # Native jobs run only when their own paths change on a PR. Pushes, the nightly
  # run and manual dispatches always exercise them. The host is TypeScript now;
  # Rust covers the v1 cleanup helper and the Linux capture helpers.
  native-linux:
    needs: changes
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.draft != true && needs.changes.outputs.native == 'true')
    runs-on: ${{ vars.CI_RUNNER_LINUX || 'ubuntu-24.04' }}
    # A cold build of the three small crates; measured well under the budget.
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 3
    steps:
      - uses: actions/checkout@v5
        with:
          filter: blob:none
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/native/houston-v1-cleanup
            native/kde-snap-shot
            native/hyprland-snap-shot
          key: linux-native-checks
      - name: Test the Houston 1 cleanup helper
        run: cargo test --locked --manifest-path apps/desktop/native/houston-v1-cleanup/Cargo.toml
      - name: Test the Linux capture helpers
        run: |
          cargo test --locked --manifest-path native/kde-snap-shot/Cargo.toml
          cargo test --locked --manifest-path native/hyprland-snap-shot/Cargo.toml

  # Windows server parity runs nightly and on pushes, never on PRs, so it cannot
  # hold a review. Its failures are real failures, not advisory. A PR can opt in
  # with the `ci:windows` label (.github/workflows/ci-windows-label.yml).
  server-windows:
    needs: changes
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/server-windows.yml

  # The single check to require. A job skipped by the path filter is a pass; a
  # failure, a cancellation, or a failed path filter is not.
  ci-gate:
    if: always()
    needs:
      - changes
      - static
      - typecheck
      - test-packages
      - test-server
      - test-web
      - test-web-browser
      - native-linux
      - server-windows
    runs-on: ${{ vars.CI_RUNNER_LINUX_SMALL || 'ubuntu-24.04' }}
    # One jq read over the job results.
    timeout-minutes: 5
    steps:
      - name: Require every job to pass or be skipped by the path filter
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$NEEDS" > needs.json
          bad=$(jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key)=\(.value.result)"' needs.json)
          if [ -n "$bad" ]; then
            echo "ci-gate: jobs that failed or were cancelled: $bad" >&2
            exit 1
          fi
          changes=$(jq -r '.changes.result' needs.json)
          if [ "$changes" != "success" ]; then
            echo "ci-gate: the changes job ended $changes; expected success so the path filter ran" >&2
            exit 1
          fi
          echo "ci-gate: every job passed or was skipped by the path filter"
