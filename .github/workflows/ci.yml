name: CI

# Public and fork-gated: PRs run safety scripts, renderer/core suites and selected integrations.
# Remaining suites and load-sensitive gates stay local (docs/operations/development.md).
# Windows also runs portable ConPTY regressions.
on:
  pull_request: {}
  push:
    branches: [main]
    # Push only, not pull_request: once these jobs are required checks, a
    # docs-only PR that skipped them via paths-ignore could never satisfy a
    # required check and would never merge.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

# A superseded run is wasted Actions minutes: cancel the previous run for this ref
# when a new commit lands on it. Keyed per PR (or per ref for pushes) so unrelated
# work is never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Cheapest and most consequential job: hermetic, sub-second text-search invariants.
  # Runs first so a violated safety rule fails fast, before any crate builds.
  safety-checks:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    env:
      HOUSTON_CHANNEL: dev
    steps:
      # Job-level elapsed time via one timestamp diff — GitHub only exposes per-step
      # durations through the Jobs API after each step completes, which needs a
      # token call for a number this gets for free.
      - name: Record job start time
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
        with:
          # Ratchets compare origin/<base> (PR) or HEAD~1 (push), so they need history.
          # The root commit is the one exception: it records the first baseline.
          fetch-depth: 0
      - name: Validate workflow syntax and reusable workflow contracts
        run: |
          tool_dir="$RUNNER_TEMP/actionlint"
          mkdir -p "$tool_dir"
          curl --fail --silent --show-error --location https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz --output "$tool_dir/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $tool_dir/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$tool_dir/actionlint.tar.gz" -C "$tool_dir" actionlint
          "$tool_dir/actionlint" -shellcheck= -pyflakes=
      - name: Test updater signature verification and release manifests
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign
          python3 scripts/test-update-manifest.py
          python3 scripts/test-release-helper.py
          python3 scripts/test-release-draft.py
      - name: Validate the PR release notes
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/release-pr.json"
          python3 scripts/release-helper.py check-pr --pr-file "$RUNNER_TEMP/release-pr.json"
      - name: check-watchdog.sh (tauri tracing-feature ban, monotonic clocks)
        run: bash scripts/check-watchdog.sh
      - name: check-dev-channel.sh (dev.sh channel resolution)
        run: bash scripts/check-dev-channel.sh
      - name: check-kill-guard.sh (kill(2) broadcast guard)
        run: bash scripts/check-kill-guard.sh
      - name: check-protocol-sync.sh (daemon/UI/doc wire version agree)
        run: bash scripts/check-protocol-sync.sh
      - name: check-case-collisions.sh (paths unique on case-insensitive filesystems)
        run: bash scripts/check-case-collisions.sh
      - name: check-loop-spawn-sync.sh (both daemon hosts call the loop-spawn helper)
        run: bash scripts/check-loop-spawn-sync.sh
      - name: check-title-tooltip-guard.sh (title= component-prop vs Tooltip conversion)
        run: bash scripts/check-title-tooltip-guard.sh
      - name: check-spawn-window.sh (CREATE_NO_WINDOW lint config still armed)
        run: bash scripts/check-spawn-window.sh
      - name: check-wsl-bundle.sh (the Windows installer bundles the Linux daemon for WSL)
        run: bash scripts/check-wsl-bundle.sh
      - name: check-icon-imports.sh (raw lucide-react imports outside components/icons.tsx)
        run: bash scripts/check-icon-imports.sh
      - name: check-native-select.sh (no native <select> — its popup is a GTK window)
        run: bash scripts/check-native-select.sh
      - name: check-native-input.sh (no native checkbox/radio — its box is drawn by the OS theme)
        run: bash scripts/check-native-input.sh
      - name: check-menu-descriptions.sh (a menu item description wraps or truncates on purpose)
        run: bash scripts/check-menu-descriptions.sh
      - name: check-doc-hygiene.sh (Markdown tree shape, plan cap, no diary content)
        run: bash scripts/check-doc-hygiene.sh
      - name: check-comment-hygiene.sh (no dates/phases/diary/app names in code comments)
        run: bash scripts/check-comment-hygiene.sh
      - name: check-type-scale.sh (semantic text tokens and an absolute 11px floor)
        run: bash scripts/check-type-scale.sh
      - name: check-label-tracking.sh (label step's uppercase tracking never leaks onto other text)
        run: bash scripts/check-label-tracking.sh
      - name: check-control-metrics.sh (control heights come from --h-* tokens)
        run: bash scripts/check-control-metrics.sh
      - name: check-radius-tokens.sh (corner radii come from --tr-radius-* rungs)
        run: bash scripts/check-radius-tokens.sh
      - name: check-spacing-tokens.sh (a stack's rhythm is the container's gap)
        run: bash scripts/check-spacing-tokens.sh
      - name: check-button-recipes.sh (button overlays keep the shared .btn base)
        run: bash scripts/check-button-recipes.sh
      - name: check-icon-metrics.sh (icon size/stroke come from --tr-icon-* rungs)
        run: bash scripts/check-icon-metrics.sh
      - name: check-shadow-recipes.sh (shadow recipes come from tokens/shadowChrome.ts, never a literal)
        run: bash scripts/check-shadow-recipes.sh
      - name: check-ellipsis.sh (real ellipsis character, never ASCII "...", in user-facing text)
        run: bash scripts/check-ellipsis.sh
      - name: check-focus-visible.sh (a killed outline gets its own focus-visible paint back)
        run: bash scripts/check-focus-visible.sh
      - name: check-empty-state-action.sh (an empty state offers the action its copy names)
        run: bash scripts/check-empty-state-action.sh
      - name: check-ui-boundary.sh (feature class strings use layout utilities only)
        run: bash scripts/check-ui-boundary.sh
      - name: check-copy.sh (interface copy uses sentence case and status vocabulary)
        run: bash scripts/check-copy.sh
      - name: check-ratchets-only-tighten.sh (the complexity ratchet only tightens)
        run: bash scripts/check-ratchets-only-tighten.sh
      - uses: oven-sh/setup-bun@v2
      # check-mutations.sh drives ui's complexity gate, which shells out to the
      # pinned oxlint under ui/node_modules — without this install the gate throws
      # before it can name the planted violation, reading as "the check did not fire".
      - name: Install renderer dependencies (oxlint for check-complexity)
        run: bun install --frozen-lockfile
        working-directory: ui
      # Last because it runs the other guards against a broken fixture: every
      # covered check must fail on it by name.
      - name: check-mutations.sh (every covered check proves it fires)
        run: bash scripts/check-mutations.sh
      - name: Report job timing
        if: always()
        continue-on-error: true
        run: |
          elapsed=$(( $(date +%s) - JOB_START ))
          {
            echo "### ${{ github.job }} timing"
            echo "| job | elapsed (s) |"
            echo "|---|---|"
            echo "| ${{ github.job }} | $elapsed |"
          } >> "$GITHUB_STEP_SUMMARY"

  # Fork PRs need more than a text search: typecheck and the jsdom suite catch
  # what safety-checks' pattern scans cannot.
  renderer-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Record job start time
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - name: Install renderer dependencies
        run: bun install --frozen-lockfile
        working-directory: ui
      - name: Typecheck
        run: bun run typecheck
        working-directory: ui
      # Never bare `bun test` — that invokes Bun's own test runner, not vitest,
      # and fails the jsdom-based suite.
      - name: Test
        run: bun run test
        working-directory: ui
      - name: Report job timing
        if: always()
        continue-on-error: true
        run: |
          elapsed=$(( $(date +%s) - JOB_START ))
          {
            echo "### ${{ github.job }} timing"
            echo "| job | elapsed (s) |"
            echo "|---|---|"
            echo "| ${{ github.job }} | $elapsed |"
          } >> "$GITHUB_STEP_SUMMARY"

  # Core unit tests and selected wire regressions run with an isolated keyring.
  # Remaining integration and load-sensitive gates stay local.
  core-checks:
    runs-on: ubuntu-latest
    env:
      HOUSTON_CHANNEL: dev
      CARGO_BUILD_JOBS: 3
    steps:
      - name: Record job start time
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
      # The runner ships none of the -dev headers these -sys crates need, so the
      # job would die in clippy rather than a test without them (alsa/dbus/udev/
      # clang/cmake/nasm). gnome-keyring and dbus-x11 are for the test step below.
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libdbus-1-dev libudev-dev \
            clang libclang-dev cmake nasm \
            gnome-keyring dbus-x11 zsh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      # Same pinned tarball + Zig build.rs step the release-linux bundle job
      # caches, scoped to core/ only — src-tauri isn't built here.
      - name: Cache the pinned libghostty-vt source and Zig
        uses: actions/cache@v5
        with:
          path: core/target/ghostty-vt
          key: ghostty-vt-ubuntu-latest-${{ hashFiles('core/houston-core/ghostty-vt.lock') }}
      - name: cargo fmt
        run: cargo fmt --all --check --manifest-path core/Cargo.toml
      - name: cargo clippy
        run: cargo clippy --all-targets --manifest-path core/Cargo.toml -- -D warnings
      # voice::cloud's tests talk to a Secret Service the runner has none of; a
      # private session bus with gnome-keyring unlocked is the same fix the local
      # Linux gate uses. No oom-shield here — that's a local-machine concern.
      - name: cargo test --lib
        run: |
          # shellcheck disable=SC2016
          dbus-run-session -- bash -c '
            eval "$(echo -n "" | gnome-keyring-daemon --unlock --components=secrets 2>/dev/null)"
            cargo test --lib --manifest-path core/Cargo.toml'
      - name: Test protocol, pane lifecycle, titles, model reuse and recovery ownership
        run: bash scripts/with-test-keyring.sh cargo test --locked --manifest-path core/Cargo.toml -p houston-core --test protocol_version_wire --test session_create_result_wire --test claude_turns_wire --test session_activity --test generated_titles --test recovery_ownership --test voice_model_reuse --test launch_prompt_isolation --test codex_shell_mcp
      # The restored-CLI regressions run real bash and zsh integration rc files.
      - name: cargo test restored shell-hosted CLI
        run: >
          bash scripts/with-test-keyring.sh cargo test --locked
          --manifest-path core/Cargo.toml -p houston-core --test resume_wire
          -- --test-threads=1 a_restored_bash_hosted_claude a_restored_zsh_hosted_claude
      - name: Report job timing
        if: always()
        continue-on-error: true
        run: |
          elapsed=$(( $(date +%s) - JOB_START ))
          {
            echo "### ${{ github.job }} timing"
            echo "| job | elapsed (s) |"
            echo "|---|---|"
            echo "| ${{ github.job }} | $elapsed |"
          } >> "$GITHUB_STEP_SUMMARY"

  linux-native-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HOUSTON_CHANNEL: dev
      CARGO_BUILD_JOBS: 3
    steps:
      - uses: actions/checkout@v5
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev \
            libasound2-dev libdbus-1-dev libudev-dev \
            clang libclang-dev cmake nasm gnome-keyring dbus-x11 zsh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core
            src-tauri
          key: linux-native-checks
      - name: Cache the pinned libghostty-vt source and Zig
        uses: actions/cache@v5
        with:
          path: core/target/ghostty-vt
          key: ghostty-vt-ubuntu-latest-${{ hashFiles('core/houston-core/ghostty-vt.lock') }}
      - uses: oven-sh/setup-bun@v2
      - name: Build renderer assets for native compilation
        working-directory: ui
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Stage debug sidecars
        run: |
          bash scripts/stage-helper.sh
          bash scripts/stage-helper.sh --bin houston-core
          bash scripts/stage-helper.sh --bin houston-supervisor
      - name: Check native formatting and Clippy
        run: |
          cargo fmt --all --check --manifest-path src-tauri/Cargo.toml
          cargo clippy --locked --all-targets --manifest-path src-tauri/Cargo.toml -- -D warnings
          cargo clippy --locked --all-targets --features bench --manifest-path src-tauri/Cargo.toml -- -D warnings
      - name: Test native application
        run: |
          bash scripts/with-test-keyring.sh cargo test --locked --manifest-path src-tauri/Cargo.toml -- --test-threads=3
          bash scripts/with-test-keyring.sh cargo test --locked --features bench --manifest-path src-tauri/Cargo.toml -- --test-threads=3

  windows-renderer-checks:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Record job start time
        run: '"JOB_START=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" >> $env:GITHUB_ENV'
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
      - name: Install renderer dependencies
        run: bun install --frozen-lockfile
        working-directory: ui
      - name: Typecheck renderer
        working-directory: ui
        run: bun run typecheck
      - name: Test renderer
        working-directory: ui
        run: bun run test
      - name: Build renderer
        working-directory: ui
        run: bun run build
      - name: Check renderer output
        working-directory: ui
        run: |
          bun run check:complexity
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          bun run check:css
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          bun run check:bundle
          exit $LASTEXITCODE
      - name: Report job timing
        if: always()
        continue-on-error: true
        run: |
          $elapsed = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds() - [long]$env:JOB_START
          "| Job | Elapsed (s) |`n|---|---|`n| windows-renderer-checks | $elapsed |" >> $env:GITHUB_STEP_SUMMARY

  windows-checks:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      HOUSTON_CHANNEL: dev
      CARGO_BUILD_JOBS: 3
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Record job start time
        run: '"JOB_START=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" >> $env:GITHUB_ENV'
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core
            src-tauri
          key: windows-checks
      - uses: oven-sh/setup-bun@v2
      - name: Build renderer assets for native compilation
        working-directory: ui
        run: |
          bun install --frozen-lockfile
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          bun run build
          exit $LASTEXITCODE
      - name: Check core formatting and Clippy
        working-directory: core
        run: |
          cargo fmt --all --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo clippy --locked --all-targets -- -D warnings
          exit $LASTEXITCODE
      - name: Test core
        working-directory: core
        run: |
          cargo test --locked -p houston-core --lib -- --test-threads=3
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked --no-fail-fast -p houston-core --test protocol_version_wire --test env_hygiene_wire --test nonascii_longpath_wire --test checkpoints_wire --test git_discard_wire --test git_tools_wire --test git_wire --test manage_wire --test shutdown_drain_wire --test subprocess_deadlines_windows --test tasks_wire --test windows_claude_hooks_wire --test windows_codex_hooks_wire --test windows_codex_launch_wire --test windows_instruction_submit --test launch_prompt_isolation --test claude_turns_wire --test session_activity --test generated_titles --test recovery_ownership --test voice_model_reuse --test windows_orchestration_wire --test wsl_wire -- --test-threads=3
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked -p houston-core --features test-barriers --test ssh_stalled_window --test windows_pty_lifecycle -- --test-threads=3
          exit $LASTEXITCODE
      - name: Stage debug sidecars
        run: |
          cargo build --locked --manifest-path core/Cargo.toml --bin houston-core --bin tr-helper
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          foreach ($name in @('houston-core', 'tr-helper')) {
            Copy-Item "core/target/debug/$name.exe" "src-tauri/binaries/$name-x86_64-pc-windows-msvc.exe"
          }
      - name: Check native application
        working-directory: src-tauri
        run: |
          cargo fmt --all --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo clippy --locked --all-targets -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked -- --test-threads=3
          exit $LASTEXITCODE
      - name: Report job timing
        if: always()
        continue-on-error: true
        run: |
          $elapsed = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds() - [long]$env:JOB_START
          "| Job | Elapsed (s) |`n|---|---|`n| windows-checks | $elapsed |" >> $env:GITHUB_STEP_SUMMARY

  # The committed third-party inventory is generated from both dependency graphs
  # at once, so this needs the Rust toolchain (cargo metadata, no build) and the
  # renderer's node_modules together — a shape none of the three jobs above has.
  licence-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # No components and no build cache: `cargo metadata` resolves the graph and
      # compiles nothing, so a restore-and-save cycle would cost more than it saves.
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
      - name: Install renderer dependencies
        run: bun install --frozen-lockfile
        working-directory: ui
      - name: check-third-party-licenses.sh (committed inventory matches the dependency graphs)
        run: ./scripts/check-third-party-licenses.sh
