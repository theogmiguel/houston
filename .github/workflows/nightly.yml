name: Nightly

# :37 past 03:00 UTC, deliberately off the hour and off midnight: GitHub's shared
# cron queue is heavily contended at :00 and at midnight UTC, and a nightly that
# is an hour late is not a problem.
on:
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

# One nightly at a time: two runs would race the rolling tag and the release it
# names, and the loser could publish artifacts built from one commit under a tag
# pointing at another. Queue, never cancel, so a manual dispatch still runs.
concurrency:
  group: nightly
  cancel-in-progress: false

# Version-PINNED, not a caret range — an unpinned CLI would change the bundle
# under us. The one source of truth; a job output (below) is the only way to
# hand it to a called workflow, since a reusable workflow's `with:` can't resolve `env`.
env:
  TAURI_CLI_VERSION: 2.11.4

jobs:
  guard:
    # The cron fires in any copy of this repository; only the upstream one may
    # publish a nightly, so a fork that merely copied the tree is refused here.
    if: github.repository == 'theogmiguel/houston'
    runs-on: ubuntu-latest
    outputs:
      # Full SHA: the bundle jobs build exactly this commit, so the artifacts
      # and the tag the roll moves point at the same tree even when the run was
      # dispatched from a branch.
      sha: ${{ steps.compute.outputs.sha }}
      version: ${{ steps.compute.outputs.version }}
      previous_tag: ${{ steps.compute.outputs.previous_tag }}
      tauri_cli_version: ${{ steps.pin.outputs.tauri_cli_version }}
    steps:
      - name: Record start time
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - id: pin
        run: echo "tauri_cli_version=$TAURI_CLI_VERSION" >> "$GITHUB_OUTPUT"

      # A nightly is a real release: it carries a signed latest.json like any
      # other, so the secrets are required before the tag is moved.
      - name: Require the updater signing secrets
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] || missing+=(TAURI_SIGNING_PRIVATE_KEY)
          [ -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ] || missing+=(TAURI_SIGNING_PRIVATE_KEY_PASSWORD)
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::this nightly is signed and the updater secrets are missing: ${missing[*]}. Set them under Settings -> Secrets and variables -> Actions; latest.json cannot carry a verifiable signature without them."
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Build the nightly version string
        id: compute
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          manifest=$(jq -r .version src-tauri/tauri.conf.json)
          [ -n "$manifest" ] || { echo "::error::tauri.conf.json .version came back empty -- expected a semver string"; exit 1; }
          # Build metadata after `+` is what semver reserves for a non-comparable
          # marker, so nightly never sorts against a stable release; the bundles
          # carry the manifest version and the version names the short sha.
          version="$manifest+nightly.$(date -u +%Y%m%d).${sha:0:7}"
          # The most recent stable bounds the generated notes; with no stable tag
          # yet, GitHub starts from the repository's first commit.
          previous_tag=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"
          echo "nightly version: $version (notes since ${previous_tag:-the first commit})"

      - name: Record job timing
        if: always()
        continue-on-error: true
        run: |
          elapsed=$(( $(date +%s) - JOB_START ))
          {
            echo "| Job | Elapsed (s) |"
            echo "|---|---|"
            echo "| guard | $elapsed |"
          } >> "$GITHUB_STEP_SUMMARY"

  # Both bundle jobs build the guard's commit, not the dispatch ref: guard read
  # main, and the roll below moves the nightly tag to that same commit.
  linux-bundle:
    needs: guard
    uses: ./.github/workflows/release-linux.yml
    with:
      ref: ${{ needs.guard.outputs.sha }}
      version: ${{ needs.guard.outputs.version }}
      tauri_cli_version: ${{ needs.guard.outputs.tauri_cli_version }}
      require_signing: true
    secrets: inherit

  windows-bundle:
    needs: guard
    uses: ./.github/workflows/release-windows.yml
    with:
      ref: ${{ needs.guard.outputs.sha }}
      version: ${{ needs.guard.outputs.version }}
      tauri_cli_version: ${{ needs.guard.outputs.tauri_cli_version }}
      require_signing: true
    secrets: inherit

  roll:
    # After the bundles, not before: a failed build leaves the previous nightly
    # in place rather than a gap where tonight's should be.
    needs: [guard, linux-bundle, windows-bundle]
    runs-on: ubuntu-latest
    steps:
      - name: Record start time
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      # Rolling a tag is the one place this repository moves a ref that already
      # exists, and `nightly` is safe only because nobody installs it by name.
      # The first night has no tag to replace; the step carries on.
      - name: Move the rolling nightly tag to main
        env:
          SHA: ${{ needs.guard.outputs.sha }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin refs/tags/nightly >/dev/null 2>&1; then
            git push origin :refs/tags/nightly
          else
            echo "no previous nightly tag to delete"
          fi
          git tag -f nightly "$SHA"
          git push origin nightly

      - name: Record job timing
        if: always()
        continue-on-error: true
        run: |
          elapsed=$(( $(date +%s) - JOB_START ))
          {
            echo "| Job | Elapsed (s) |"
            echo "|---|---|"
            echo "| roll | $elapsed |"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: [guard, roll]
    uses: ./.github/workflows/release-publish.yml
    with:
      tag: nightly
      version: ${{ needs.guard.outputs.version }}
      title: Houston nightly ${{ needs.guard.outputs.version }}
      previous_tag: ${{ needs.guard.outputs.previous_tag }}
      # A prerelease, never a draft: releases/latest skips prereleases, and the
      # publish job replaces yesterday's release only after the notes and
      # manifest are good, so a failure there leaves the previous nightly.
      draft: false
      prerelease: true
      replace_existing: true
      notes_header: 'Built from main automatically, never smoke-tested by a person, and replaced every night. Do not install this unless you have opted into the nightly channel in Settings.'
