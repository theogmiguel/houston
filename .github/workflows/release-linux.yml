name: Build Linux packages (internal)

on:
  workflow_call:
    inputs:
      version:
        description: "Manifest version from the version-guard job: names the uploaded artifact and must match the checked-out tree"
        type: string
        required: true
      ref:
        description: "Commit to build; a cut passes its tag and Build installers passes a resolved SHA"
        type: string
        required: false
        default: ""
      tauri_cli_version:
        description: "Pinned Tauri CLI version, used only for Minisign signing so installed Tauri copies can update"
        type: string
        required: true
      require_signing:
        description: "Fail when the updater signing secrets are absent; a real release passes true, a dry run false"
        type: boolean
        required: false
        default: true
    secrets:
      # Declared so a caller can see the contract; both are optional because a
      # dry run passes no secrets. Callers use `secrets: inherit`.
      TAURI_SIGNING_PRIVATE_KEY:
        description: "Updater signing key. Set, the AppImage and the deb each ship a .sig beside them"
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        description: "Passphrase for TAURI_SIGNING_PRIVATE_KEY; leave unset for an unencrypted key"
        required: false

permissions:
  contents: read

jobs:
  linux-bundle:
    # One native runner per architecture, jammy rather than latest on purpose:
    # the runner's glibc is the artifact's floor, and a build on 24.04 refuses
    # to start on 22.04. The arm runner builds aarch64 natively.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    env:
      HOUSTON_CHANNEL: dev
    steps:
      - name: Record start time
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5
        with:
          # A cut's default checkout is the pre-bump dispatch SHA, so it hands
          # its new tag through here; empty means the triggering ref.
          ref: ${{ inputs.ref }}

      # The whole tree must be the release commit, not just the file a bundle
      # filename reads: every manifest reports its own version at runtime, and a
      # checkout from the wrong ref is refused here, before anything is built.
      - name: Require the checked-out tree to carry the release version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          base="${VERSION%%+*}"
          [ -n "$base" ] || { echo "::error::version input '$VERSION' has no base before its + build metadata"; exit 1; }
          ./scripts/set-version.sh --check "$base"

      # Electron's AppImage runtime mounts through FUSE 2, and xz packs the deb.
      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 xz-utils binutils

      # A runner boots systemd as PID 1 but the `runner` user has no logind
      # session, so there is no user bus and `systemd-run --user` fails.
      # enable-linger starts user@$UID without a login, unblocking the shield.
      - name: Give the runner a systemd user session (oom-shield needs one)
        run: |
          set -euo pipefail
          sudo loginctl enable-linger "$USER"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"

      - name: Smoke-test the shield before paying for the build
        run: ./scripts/oom-shield.sh true

      - uses: dtolnay/rust-toolchain@stable
      # The packaging script builds the Houston 1 cleanup helper with Cargo.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/native/houston-v1-cleanup
          key: release-linux-${{ matrix.arch }}
          cache-on-failure: true
      # Secrets cannot be used in an `if:`, so they are read into env here and
      # tested; the decision travels on as a step output. A real release
      # requires them by input, a dry run reports the gap instead.
      - name: Decide which signing path this run takes
        id: signing
        env:
          REQUIRE_SIGNING: ${{ inputs.require_signing }}
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          SIGNING_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ "$REQUIRE_SIGNING" = "true" ]; then
            missing=()
            [ -n "$SIGNING_KEY" ] || missing+=(TAURI_SIGNING_PRIVATE_KEY)
            [ -n "$SIGNING_KEY_PASSWORD" ] || missing+=(TAURI_SIGNING_PRIVATE_KEY_PASSWORD)
            if [ "${#missing[@]}" -ne 0 ]; then
              echo "::error::this release is signed and the updater secrets are missing: ${missing[*]}. Set them under Settings -> Secrets and variables -> Actions; latest.json cannot carry a verifiable signature without them."
              exit 1
            fi
          elif [ -z "$SIGNING_KEY" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "TAURI_SIGNING_PRIVATE_KEY is not set and this run does not require signing: the bundles ship without Minisign signatures and installed Tauri copies cannot verify them." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "signed=true" >> "$GITHUB_OUTPUT"
          {
            echo "TAURI_SIGNING_PRIVATE_KEY<<HOUSTON_SIGNING_KEY_EOF"
            printf '%s\n' "$SIGNING_KEY"
            echo "HOUSTON_SIGNING_KEY_EOF"
          } >> "$GITHUB_ENV"
          if [ -n "$SIGNING_KEY_PASSWORD" ]; then
            {
              echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD<<HOUSTON_SIGNING_PASSWORD_EOF"
              printf '%s\n' "$SIGNING_KEY_PASSWORD"
              echo "HOUSTON_SIGNING_PASSWORD_EOF"
            } >> "$GITHUB_ENV"
          fi

      - name: Cache the pinned Tauri CLI
        if: steps.signing.outputs.signed == 'true'
        id: tauri-cli-cache
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: cargo-tauri-${{ inputs.tauri_cli_version }}-ubuntu-22.04-${{ matrix.arch }}
      - name: Install the pinned Tauri CLI for Minisign signing
        if: steps.signing.outputs.signed == 'true' && steps.tauri-cli-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version ${{ inputs.tauri_cli_version }} --locked

      # The desktop package is built with the Node version its workspace pins in
      # package.json engines.node, not the runner's default.
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Install the workspace
        run: pnpm install --frozen-lockfile

      - name: Build the AppImage and deb
        env:
          CARGO_BUILD_JOBS: "3"
          VERSION: ${{ inputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          # A restored cache must not contribute an older artifact or .sig.
          rm -rf release
          base="${VERSION%%+*}"
          ./scripts/oom-shield.sh node scripts/build-desktop-artifact.ts \
            --platform linux --target AppImage --arch "$ARCH" \
            --version "$base" --output-dir release --verbose

      # Minisign signatures are the update bridge: an installed Tauri copy
      # verifies the Electron bundle against the public key it already trusts.
      - name: Sign the updater artifacts
        if: steps.signing.outputs.signed == 'true'
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=(release/*.AppImage release/*.deb)
          [ "${#artifacts[@]}" -gt 0 ] || { echo "::error::no AppImage or deb in release to sign"; exit 1; }
          for artifact in "${artifacts[@]}"; do
            cargo tauri signer sign "$artifact"
          done

      # The bundles are checked to CONTAIN the application rather than assumed
      # to. This is the one packaging fact this workflow can prove.
      - name: Collect artifacts
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p dist
          cp release/*.AppImage release/*.deb dist/
          cp release/latest-linux*.yml dist/
          appimages=(dist/*.AppImage)
          debs=(dist/*.deb)
          if [ "${#appimages[@]}" -ne 1 ]; then
            echo "::error::expected exactly one AppImage in dist, found ${#appimages[@]}"
            printf '  %s\n' "${appimages[@]}"
            exit 1
          fi
          if [ "${#debs[@]}" -ne 1 ]; then
            echo "::error::expected exactly one deb in dist, found ${#debs[@]}"
            printf '  %s\n' "${debs[@]}"
            exit 1
          fi
          appimage="${appimages[0]}"
          deb="${debs[0]}"

          package_root=$(mktemp -d)
          trap 'rm -rf "$package_root"' EXIT
          dpkg-deb -x "$deb" "$package_root/deb"
          [ -x "$package_root/deb/opt/Houston/houston" ] || {
            echo "::error::$deb does not contain /opt/Houston/houston"
            exit 1
          }
          appimage_path=$(realpath "$appimage")
          mkdir "$package_root/appimage"
          (cd "$package_root/appimage" && "$appimage_path" --appimage-extract >/dev/null)
          [ -x "$package_root/appimage/squashfs-root/houston" ] || {
            echo "::error::$appimage does not contain the houston executable"
            exit 1
          }
          ls -lh dist

      # A signed run that lost a .sig is a broken updater contract, so only the
      # signed one has this requirement.
      - name: Assert the updater signatures
        if: steps.signing.outputs.signed == 'true'
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=(dist/*.AppImage dist/*.deb)
          missing=0
          for artifact in "${artifacts[@]}"; do
            if [ ! -f "$artifact.sig" ]; then
              echo "::error::$artifact has no .sig beside it, but this run has TAURI_SIGNING_PRIVATE_KEY -- an updater cannot verify an unsigned artifact"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "updater signatures:"
          printf '  %s.sig\n' "${artifacts[@]}"

      # electron-updater reads the same release; its hashes must describe the
      # bytes that are uploaded.
      - name: Check the electron-updater metadata
        run: node scripts/refresh-updater-metadata.mjs dist --check

      # The deb is the shape a user installs, so that is what is read: the
      # binary must be this architecture and ask glibc for nothing above
      # jammy's 2.35, or "built on 22.04" is not the promise it says.
      - name: Gate the deb against the 22.04 glibc floor and this architecture
        run: |
          set -euo pipefail
          deb=$(find dist -name '*.deb' -print -quit)
          ./scripts/check-linux-abi.sh "$deb" "${{ matrix.arch }}"

      - name: Boot the packaged binary on a baseline x86_64 CPU
        if: matrix.arch == 'x86_64'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y qemu-user
          package_root=$(mktemp -d)
          trap 'rm -rf "$package_root"' EXIT
          deb=$(find dist -name '*.deb' -print -quit)
          dpkg-deb -x "$deb" "$package_root"
          qemu-x86_64 -cpu qemu64 "$package_root/opt/Houston/houston" --version --no-sandbox

      - uses: actions/upload-artifact@v7
        with:
          name: houston-${{ inputs.version }}-linux-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

      - name: Record job timing
        if: always()
        continue-on-error: true
        run: |
          elapsed=$(( $(date +%s) - JOB_START ))
          {
            echo "| Job | Elapsed (s) |"
            echo "|---|---|"
            echo "| linux-bundle (${{ matrix.arch }}) | $elapsed |"
          } >> "$GITHUB_STEP_SUMMARY"

  # The automated half of the smoke-test promise: the built x86_64 AppImage must
  # load and answer --version on every distribution the docs claim, with only
  # the libraries a desktop has. The graphical run stays manual (no display).
  appimage-smoke:
    needs: linux-bundle
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:22.04
            packages: libgtk-3-0 libgl1 libegl1 libgbm1 libfribidi0 libnss3 libxss1 libasound2 libatk-bridge2.0-0 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libpango-1.0-0 libcairo2 libatspi2.0-0 libsecret-1-0
            installer: apt
          - image: ubuntu:24.04
            packages: libgtk-3-0t64 libgl1 libegl1 libgbm1 libfribidi0 libnss3 libxss1 libasound2t64 libatk-bridge2.0-0t64 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libpango-1.0-0 libcairo2 libatspi2.0-0t64 libsecret-1-0
            installer: apt
          - image: debian:12
            packages: libgtk-3-0 libgl1 libegl1 libgbm1 libfribidi0 libnss3 libxss1 libasound2 libatk-bridge2.0-0 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libpango-1.0-0 libcairo2 libatspi2.0-0 libsecret-1-0
            installer: apt
          - image: fedora:latest
            packages: gtk3 mesa-libGL mesa-libEGL mesa-libgbm fribidi nss libXScrnSaver alsa-lib at-spi2-atk at-spi2-core libdrm libxkbcommon libXcomposite libXdamage libXfixes libXrandr pango cairo libsecret
            installer: dnf
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    steps:
      - name: Record start time
        shell: bash
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v7
        with:
          name: houston-${{ inputs.version }}-linux-x86_64
          path: dist

      - name: Install the runtime libraries a desktop provides
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.installer }}" = "dnf" ]; then
            dnf install -y -q ${{ matrix.packages }}
          else
            apt-get update -qq
            apt-get install -y -qq ${{ matrix.packages }}
          fi

      # --version exits before any window, channel or server, so it proves the
      # full dynamic dependency chain loads on this distribution headlessly.
      - name: Boot the AppImage headless
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          appimage=$(find dist -name '*.AppImage' -print -quit)
          [ -n "$appimage" ] || { echo "::error::no .AppImage in houston-$VERSION-linux-x86_64"; exit 1; }
          chmod +x "$appimage"
          "$appimage" --appimage-extract >/dev/null
          out=$(./squashfs-root/AppRun --version --no-sandbox)
          printf '%s\n' "$out"
          base="${VERSION%%+*}"
          if [ "$out" != "$base" ]; then
            echo "::error::${{ matrix.image }} printed '$out', expected '$base'"
            exit 1
          fi

      - name: Record job timing
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          elapsed=$(( $(date +%s) - JOB_START ))
          {
            echo "| Job | Elapsed (s) |"
            echo "|---|---|"
            echo "| appimage-smoke (${{ matrix.image }}) | $elapsed |"
          } >> "$GITHUB_STEP_SUMMARY"
