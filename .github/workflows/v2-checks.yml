name: v2-checks

# Gates for the v2 rebuild: its integration PR into main and slice PRs into v2. A push
# to v2 already runs through the open integration PR, so there is no push trigger.
on:
  pull_request:
    branches: [main, v2]
  workflow_dispatch:

concurrency:
  group: v2-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # handoff/ is working material deleted before v2 merges into main, and the paths
  # upstream.json lists as imported stay byte-identical to upstream; every other
  # Markdown file in the tree keeps the usual hygiene rules.
  doc-hygiene:
    if: github.event_name == 'workflow_dispatch' || github.base_ref == 'v2' || github.head_ref == 'v2' || startsWith(github.head_ref, 'v2-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Drop handoff/ from the checked-out tree
        run: |
          if [ -d handoff ]; then
            git rm -r -q --cached handoff
            rm -rf handoff
          fi
      - name: Drop upstream's imported paths from the checked-out tree
        run: |
          if [ -f upstream.json ]; then
            jq -r '.imported[]' upstream.json | while IFS= read -r path; do
              if [ -e "$path" ]; then
                git rm -r -q --cached -- "$path"
                rm -rf -- "$path"
              fi
            done
          fi
      - name: check-doc-hygiene.sh (outside handoff/ and imported paths)
        run: bash scripts/check-doc-hygiene.sh

  # Ported code may only exist alongside its upstream MIT notice, in both the source
  # tree's NOTICE and the inventory the app ships.
  licence-notice:
    if: github.event_name == 'workflow_dispatch' || github.base_ref == 'v2' || github.head_ref == 'v2' || startsWith(github.head_ref, 'v2-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Upstream MIT notice is present
        run: |
          notice='Copyright (c) 2026 T3 Tools Inc.'
          for file in NOTICE third-party-licenses.config.json src-tauri/resources/third-party-licenses.json; do
            if ! grep -qF "$notice" "$file"; then
              echo "v2-checks: $file lacks the upstream licence line \"$notice\"; ported code cannot ship without it." >&2
              echo "  Restore it in NOTICE and third-party-licenses.config.json, then run: node scripts/gen-third-party-licenses.mjs" >&2
              exit 1
            fi
          done
          echo "v2-checks: upstream MIT notice present in NOTICE and the licence inventory"

  # Slice PRs that touch the copied server packages or their workspace plumbing
  # get the full gate: install, typecheck, tests, and zero drift from the pinned
  # upstream commit.
  server-packages-paths:
    if: github.event_name == 'workflow_dispatch' || github.base_ref == 'v2' || github.head_ref == 'v2' || startsWith(github.head_ref, 'v2-')
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.paths.outputs.server }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: paths
        name: Detect server-package changes
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "server=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="$(git merge-base "origin/$GITHUB_BASE_REF" HEAD)"
          if git diff --name-only "$base" HEAD | grep -qE '^((packages|apps|patches|scripts|oxlint-plugin-t3code)/|package\.json$|pnpm-workspace\.yaml$|pnpm-lock\.yaml$|tsconfig\.base\.json$|vite\.config\.ts$|upstream\.json$|\.github/workflows/v2-checks\.yml$)'; then
            echo "server=true" >> "$GITHUB_OUTPUT"
          else
            echo "server=false" >> "$GITHUB_OUTPUT"
          fi

  server-packages:
    needs: server-packages-paths
    if: needs.server-packages-paths.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm --filter @t3tools/contracts --filter @t3tools/shared test
      - name: Script tests (check-upstream and the licence generator)
        run: node --test scripts/check-upstream.test.mjs scripts/gen-third-party-licenses.test.mjs
      - name: Fetch upstream t3code at the pinned commit
        run: |
          git init "$RUNNER_TEMP/t3code"
          git -C "$RUNNER_TEMP/t3code" remote add origin https://github.com/pingdotgg/t3code.git
          git -C "$RUNNER_TEMP/t3code" fetch --depth 1 origin 9826dbb9904b2591bfbf60d1317486b59132f56b
          git -C "$RUNNER_TEMP/t3code" checkout --detach FETCH_HEAD
      - name: check-upstream.mjs (copied files match the pinned commit)
        run: node scripts/check-upstream.mjs "$RUNNER_TEMP/t3code"

  # Upstream's persistence store on both release platforms: the event store,
  # migrations, projections, outbox and receipts run against a real node:sqlite
  # database in temp directories.
  server-persistence:
    needs: server-packages-paths
    if: needs.server-packages-paths.outputs.server == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Windows runs and reports, but does not fail the job until the
      # Windows parity slice lands; the known failures are tabled on #373.
      - name: Persistence tests (src/persistence)
        continue-on-error: ${{ matrix.os == 'windows-latest' }}
        run: pnpm --filter t3 exec vp test run src/persistence

  # Upstream's provider layer on both release platforms: the provider packages,
  # the server's src/provider layer and the orchestration adapters replaying
  # recorded traffic through their testkits.
  server-providers:
    needs: server-packages-paths
    if: needs.server-packages-paths.outputs.server == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Every step runs even after an earlier one fails. Windows reports but
      # does not fail the job until the Windows parity slice (failures on #374).
      - name: Provider packages
        continue-on-error: ${{ matrix.os == 'windows-latest' }}
        run: pnpm --no-bail --filter @t3tools/provider-core --filter effect-codex-app-server --filter effect-acp --filter @t3tools/provider-acp --filter @t3tools/provider-acp-registry --filter @t3tools/provider-opencode test
      - name: Server provider layer (src/provider)
        continue-on-error: ${{ matrix.os == 'windows-latest' }}
        if: ${{ !cancelled() }}
        run: pnpm --filter t3 exec vp test run src/provider
      - name: Orchestration adapters (src/orchestration-v2/Adapters)
        continue-on-error: ${{ matrix.os == 'windows-latest' }}
        if: ${{ !cancelled() }}
        run: pnpm --filter t3 exec vp test run src/orchestration-v2/Adapters
