name: Build Windows installer (internal)

on:
  workflow_call:
    inputs:
      version:
        description: "Manifest version from the caller, used to name the uploaded artifact"
        type: string
        required: true
      ref:
        description: "Commit to build; a cut passes its tag and Build installers passes a resolved SHA"
        type: string
        required: false
        default: ""
      tauri_cli_version:
        description: "Pinned Tauri CLI version, used only for Minisign signing so installed Tauri copies can update"
        type: string
        required: true
      require_signing:
        description: "Fail when the updater signing secrets are absent; a real release passes true, a dry run false"
        type: boolean
        required: false
        default: true
    # Declared so a caller can see the contract; all are optional because a dry
    # run passes no secrets. Callers use `secrets: inherit`.
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false
      AZURE_TENANT_ID:
        required: false
      AZURE_CLIENT_ID:
        required: false
      AZURE_CLIENT_SECRET:
        required: false
      AZURE_TRUSTED_SIGNING_ENDPOINT:
        required: false
      AZURE_TRUSTED_SIGNING_ACCOUNT_NAME:
        required: false
      AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME:
        required: false

permissions:
  contents: read

jobs:
  windows-bundle:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      HOUSTON_CHANNEL: dev
      CARGO_BUILD_JOBS: 3
    steps:
      - name: Record start time
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
        shell: bash

      # Packaging fixes on the workflow branch apply when an older tag is
      # rebuilt; the application source still comes from the tag.
      - name: Check out packaging automation
        uses: actions/checkout@v5
      - name: Preserve packaging scripts when rebuilding an older tag
        shell: pwsh
        run: |
          $staged = Join-Path $env:RUNNER_TEMP 'release-packaging'
          New-Item -ItemType Directory -Force $staged | Out-Null
          Copy-Item scripts/build-desktop-artifact.ts $staged
          Copy-Item scripts/refresh-updater-metadata.mjs $staged
          Copy-Item -Recurse scripts/lib (Join-Path $staged 'lib')
          New-Item -ItemType Directory -Force (Join-Path $staged 'installer') | Out-Null
          Copy-Item apps/desktop/resources/installer.nsh (Join-Path $staged 'installer')
      - name: Check out the application source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - name: Use the workflow's packaging scripts
        shell: pwsh
        run: |
          $staged = Join-Path $env:RUNNER_TEMP 'release-packaging'
          Copy-Item (Join-Path $staged 'build-desktop-artifact.ts') scripts/ -Force
          Copy-Item (Join-Path $staged 'refresh-updater-metadata.mjs') scripts/ -Force
          Copy-Item (Join-Path $staged 'lib') scripts/ -Recurse -Force
          Copy-Item (Join-Path $staged 'installer/installer.nsh') apps/desktop/resources/installer.nsh -Force

      - name: Require the checked-out tree to carry the release version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          base="${VERSION%%+*}"
          [ -n "$base" ] || { echo "::error::version input '$VERSION' has no base before its + build metadata"; exit 1; }
          ./scripts/set-version.sh --check "$base"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/native/houston-v1-cleanup
          key: release-windows
          cache-on-failure: true

      - name: Cache the pinned Tauri CLI
        id: tauri-cli-cache
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/cargo-tauri.exe
          key: cargo-tauri-prebuilt-${{ inputs.tauri_cli_version }}-windows-2022

      - name: Install the pinned Tauri CLI
        if: steps.tauri-cli-cache.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAURI_CLI_VERSION: ${{ inputs.tauri_cli_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $release = gh api "repos/tauri-apps/tauri/releases/tags/tauri-cli-v$env:TAURI_CLI_VERSION" | ConvertFrom-Json
          if ($LASTEXITCODE) { throw 'Unable to read the pinned Tauri CLI release' }
          $assets = @($release.assets | Where-Object name -EQ 'cargo-tauri-x86_64-pc-windows-msvc.zip')
          if ($assets.Count -ne 1 -or $assets[0].digest -notmatch '^sha256:[a-f0-9]{64}$') {
            throw "Expected one Windows Tauri CLI asset with a SHA-256 digest for $env:TAURI_CLI_VERSION"
          }
          $archive = Join-Path $env:RUNNER_TEMP 'cargo-tauri.zip'
          Invoke-WebRequest $assets[0].browser_download_url -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ("sha256:$actual" -ne $assets[0].digest) { throw 'Tauri CLI archive checksum mismatch' }
          $expanded = Join-Path $env:RUNNER_TEMP 'cargo-tauri'
          Expand-Archive -LiteralPath $archive -DestinationPath $expanded -Force
          Copy-Item -LiteralPath (Join-Path $expanded 'cargo-tauri.exe') -Destination "$HOME/.cargo/bin/cargo-tauri.exe" -Force

      - name: Verify the pinned Tauri CLI
        shell: pwsh
        env:
          TAURI_CLI_VERSION: ${{ inputs.tauri_cli_version }}
        run: |
          $actual = cargo tauri --version
          if ($LASTEXITCODE -or $actual -ne "tauri-cli $env:TAURI_CLI_VERSION") {
            throw "Expected tauri-cli $env:TAURI_CLI_VERSION, got '$actual'"
          }

      - name: Decide which signing paths this run takes
        id: signing
        shell: bash
        env:
          REQUIRE_SIGNING: ${{ inputs.require_signing }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
        run: |
          set -euo pipefail
          azure_values=(
            "$AZURE_TENANT_ID"
            "$AZURE_CLIENT_ID"
            "$AZURE_CLIENT_SECRET"
            "$AZURE_TRUSTED_SIGNING_ENDPOINT"
            "$AZURE_TRUSTED_SIGNING_ACCOUNT_NAME"
            "$AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME"
          )
          azure_names=(
            AZURE_TENANT_ID
            AZURE_CLIENT_ID
            AZURE_CLIENT_SECRET
            AZURE_TRUSTED_SIGNING_ENDPOINT
            AZURE_TRUSTED_SIGNING_ACCOUNT_NAME
            AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME
          )
          azure_present=0
          azure_missing=()
          for index in "${!azure_values[@]}"; do
            if [ -n "${azure_values[$index]}" ]; then
              azure_present=$((azure_present + 1))
            else
              azure_missing+=("${azure_names[$index]}")
            fi
          done
          if [ "$azure_present" -gt 0 ] && [ "${#azure_missing[@]}" -gt 0 ]; then
            echo "::error::Azure Trusted Signing is partially configured; missing: ${azure_missing[*]}. Set all six Azure secrets or remove all six to ship without Authenticode."
            exit 1
          fi
          if [ "$azure_present" -eq "${#azure_values[@]}" ]; then
            echo "azure=true" >> "$GITHUB_OUTPUT"
          else
            echo "azure=false" >> "$GITHUB_OUTPUT"
          fi
          updater=false
          if [ "$REQUIRE_SIGNING" = "true" ]; then
            missing=()
            [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] || missing+=(TAURI_SIGNING_PRIVATE_KEY)
            [ -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ] || missing+=(TAURI_SIGNING_PRIVATE_KEY_PASSWORD)
            if [ "${#missing[@]}" -ne 0 ]; then
              echo "::error::this release is signed and the updater secrets are missing: ${missing[*]}. Set them under Settings -> Secrets and variables -> Actions (TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD); latest.json cannot carry a verifiable signature without them."
              exit 1
            fi
            updater=true
          elif [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            updater=true
          fi
          echo "updater=$updater" >> "$GITHUB_OUTPUT"
          if [ "$updater" = "true" ]; then
            {
              echo "TAURI_SIGNING_PRIVATE_KEY<<HOUSTON_SIGNING_KEY_EOF"
              printf '%s\n' "$TAURI_SIGNING_PRIVATE_KEY"
              echo "HOUSTON_SIGNING_KEY_EOF"
            } >> "$GITHUB_ENV"
            if [ -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then
              {
                echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD<<HOUSTON_SIGNING_PASSWORD_EOF"
                printf '%s\n' "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
                echo "HOUSTON_SIGNING_PASSWORD_EOF"
              } >> "$GITHUB_ENV"
            fi
          fi

      # The embedded desktop and server bundles use the Node version the
      # workspace pins in package.json engines.node, not the runner's default.
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Install the workspace
        run: pnpm install --frozen-lockfile

      - name: Build the NSIS installer
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item -Recurse -Force release -ErrorAction SilentlyContinue
          $base = $env:VERSION.Split('+')[0]
          node scripts/build-desktop-artifact.ts --platform win --target nsis --arch x64 --version $base --output-dir release --verbose
          if ($LASTEXITCODE) { throw "the desktop artifact build failed with exit code $LASTEXITCODE" }

      - name: Stage the installer and its electron-updater feed
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist | Out-Null
          $installers = @(Get-ChildItem release -Filter '*-setup.exe')
          if ($installers.Count -ne 1) {
            Write-Error "expected exactly one NSIS installer in release, found $($installers.Count): $($installers.FullName -join ', ')"
            exit 1
          }
          Copy-Item $installers[0].FullName dist/
          $metadata = Join-Path (Get-Location) 'release/latest.yml'
          if (-not (Test-Path $metadata)) {
            Write-Error "$metadata missing -- electron-builder did not write the Windows update feed"
            exit 1
          }
          Copy-Item $metadata dist/

      - name: Sign the NSIS installer with Azure Trusted Signing
        if: steps.signing.outputs.azure == 'true'
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files-folder: dist
          files-folder-filter: exe

      - name: Sign the NSIS installer for the updater
        if: steps.signing.outputs.updater == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem dist -Filter *.exe)
          if ($installers.Count -eq 0) {
            Write-Error "no NSIS installer under dist -- nothing to sign"
            exit 1
          }
          foreach ($installer in $installers) {
            $signature = "$($installer.FullName).sig"
            Remove-Item $signature -Force -ErrorAction SilentlyContinue
            cargo tauri signer sign $installer.FullName
            if ($LASTEXITCODE) {
              throw "cargo tauri signer sign failed for $($installer.FullName) with exit code $LASTEXITCODE"
            }
            if (-not (Test-Path $signature) -or (Get-Item $signature).Length -eq 0) {
              Write-Error "updater signature missing after signing $($installer.FullName) -- latest.json cannot be built"
              exit 1
            }
          }

      # Authenticode rewrites the installer, so the feed must describe the bytes
      # that are actually uploaded.
      - name: Refresh the electron-updater feed hashes
        shell: bash
        run: node scripts/refresh-updater-metadata.mjs dist

      - name: Note that the installer is unsigned
        if: steps.signing.outputs.azure == 'false'
        shell: bash
        run: |
          set -euo pipefail
          echo "The NSIS installer is unsigned, so SmartScreen will warn on first run. Signing stays off because the secret AZURE_TRUSTED_SIGNING_ACCOUNT_NAME is not set." >> "$GITHUB_STEP_SUMMARY"

      - name: Note that the installer has no updater signature
        if: steps.signing.outputs.updater == 'false'
        shell: bash
        run: |
          set -euo pipefail
          echo "The NSIS installer has no updater Minisign signature: this run did not require signing and the TAURI_SIGNING_PRIVATE_KEY secret is not set." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: houston-${{ inputs.version }}-windows
          path: dist/
          if-no-files-found: error

      - name: Record job timing
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          elapsed=$(( $(date +%s) - JOB_START ))
          {
            echo "| Job | Elapsed (s) |"
            echo "|---|---|"
            echo "| windows-bundle | $elapsed |"
          } >> "$GITHUB_STEP_SUMMARY"
