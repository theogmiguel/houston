name: Promote draft to public

# The only workflow that makes a release visible; it runs after a person has
# installed and run the draft's artifact on a real desktop. The required
# reviewer on the `stable-release` environment is the actual control.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag of the draft release to publish'
        type: string
        required: true
      smoke_tested:
        description: 'A person installed this build and ran it on a desktop'
        type: boolean
        required: true
        default: false

permissions:
  contents: write

jobs:
  publish:
    # Records who approved; a required reviewer is configured on this
    # environment in repository settings, not here.
    environment: stable-release
    runs-on: ubuntu-latest
    concurrency:
      group: release-state-${{ inputs.tag }}
      cancel-in-progress: false
    steps:
      - name: Refuse an unattested release
        if: inputs.smoke_tested != true
        run: |
          echo "::error::smoke_tested is not ticked: nobody has installed this build and run it on a desktop, and that is the one check no runner can perform"
          exit 1

      - name: Record start time
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5

      - name: Install signature verifier
        run: sudo apt-get update && sudo apt-get install -y minisign

      - name: Refuse a missing or already published release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          python3 scripts/release-draft.py snapshot --repository "$GITHUB_REPOSITORY" --tag "$TAG" --output draft-snapshot.json

      - name: Download the draft's assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh release download "$TAG" --dir release-assets
          if [ ! -f release-assets/latest.json ]; then
            echo "::error::release $TAG carries no latest.json; a draft without one cannot be promoted"
            exit 1
          fi
          # Held out of the generator's input: it refuses an artifact set that
          # already contains a latest.json, since it is the file's author.
          mv release-assets/latest.json shipped-latest.json
          ls -lh release-assets

      - name: Verify assets, synchronize reviewed notes and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          python3 scripts/test-update-manifest.py
          python3 scripts/release-draft.py promote --repository "$GITHUB_REPOSITORY" --tag "$TAG" --assets release-assets --shipped shipped-latest.json --notes-file notes.md --output synchronized/latest.json --snapshot draft-snapshot.json
          {
            echo "## Published: $TAG"
            echo "[Open the release](https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG). The app and release page now use the reviewed notes."
            echo "Elapsed: $(( $(date +%s) - JOB_START )) seconds."
          } >> "$GITHUB_STEP_SUMMARY"
